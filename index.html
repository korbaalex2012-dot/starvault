<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StarVault - Меню</title>
    <style>
        :root {
            --bg-dark: #070a12;
            --panel-bg: rgba(19, 26, 38, 0.9);
            --accent-blue: #00e5ff;
            --accent-gold: #ffc107;
            --text-main: #ffffff;
            --text-muted: #707e94;
            
            --bronze: #cd7f32;
            --silver: #c0c0c0;
            --gold: #ffd700;

            --radar-red: #ff3d71;
            --radar-yellow: #ffaa00;
            --radar-green: #00e676;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #020408;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .app-container {
            width: 100%;
            max-width: 390px;
            height: 700px;
            background-color: var(--bg-dark);
            border: 2px solid #1f293d;
            border-radius: 28px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
            overflow: hidden;
        }

        .screen {
            display: none;
            flex-direction: column;
            height: 100%;
            width: 100%;
            z-index: 5;
        }

        .screen.active {
            display: flex;
        }

        .screen-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .btn-back {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background-color: var(--panel-bg);
            border: 2px solid #243147;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .screen-title {
            font-size: 20px;
            font-weight: 800;
            text-transform: uppercase;
            color: var(--accent-blue);
        }

        /* ГЛАВНОЕ МЕНЮ */
        .main-action-zone {
            margin-top: 150px;
            margin-bottom: 20px;
        }

        .main-button {
            width: 100%;
            height: 160px;
            border: 2px solid var(--accent-blue);
            border-radius: 20px;
            background-color: var(--panel-bg);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(0, 229, 255, 0.2);
        }

        .main-button .title {
            font-size: 22px;
            font-weight: 800;
            text-transform: uppercase;
            color: #fff;
        }

        /* СЕТКА КЕЙСОВ */
        .cases-grid-wrapper {
            flex: 1;
            overflow-y: auto;
        }

        .cases-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            padding-bottom: 20px;
        }

        .case-card {
            background-color: rgba(15, 22, 36, 0.85);
            border-radius: 16px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            cursor: pointer;
        }

        .case-icon-placeholder {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .tier-bronze { border: 2px solid var(--bronze); }
        .tier-silver { border: 2px solid var(--silver); }
        .tier-gold { border: 2px solid var(--accent-gold); }

        .case-name {
            font-size: 14px;
            font-weight: 700;
            color: #fff;
            text-transform: uppercase;
        }

        /* ИГРОВОЙ ЭКРАН */
        .game-screen-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }

        .radar-panel {
            width: 100%;
            background-color: rgba(15, 22, 36, 0.9);
            border: 2px solid #243147;
            border-radius: 16px;
            padding: 15px;
            text-align: center;
        }

        .radar-value {
            font-size: 28px;
            font-weight: 900;
            color: var(--text-muted);
        }

        .lock-container {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 25px 0;
            width: 100%;
        }

        .drum-column {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            background: rgba(10, 15, 26, 0.85);
            border: 2px solid #1f293d;
            border-radius: 14px;
            padding: 8px 4px;
            flex: 1;
        }

        .drum-btn {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            border: 1px solid #2d3d5a;
            background: #162032;
            color: var(--accent-blue);
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .drum-display {
            font-size: 26px;
            font-weight: 900;
            color: #fff;
        }

        .btn-action-submit {
            width: 100%;
            height: 60px;
            background: linear-gradient(135deg, #00b0ff, #00e5ff);
            border: none;
            border-radius: 16px;
            color: #000;
            font-size: 18px;
            font-weight: 800;
            text-transform: uppercase;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="app-container" id="appContainer">

    <div id="mainMenuScreen" class="screen active">
        <div class="main-action-zone">
            <div class="main-button" id="btnOpenSafes">
                <span class="title">Открыть сейф</span>
            </div>
        </div>
    </div>

    <div id="casesScreen" class="screen">
        <div class="screen-header">
            <button class="btn-back" id="btnBackToMenu">⬅</button>
            <div class="screen-title">Выбор хранилища</div>
        </div>

        <div class="cases-grid-wrapper">
            <div class="cases-grid">
                
                <div class="case-card tier-bronze" data-name="Деревянный">
                    <div class="case-icon-placeholder">📦</div>
                    <div class="case-name">Деревянный</div>
                </div>

                <div class="case-card tier-silver" data-name="Стальной">
                    <div class="case-icon-placeholder">⚙️</div>
                    <div class="case-name">Стальной</div>
                </div>

                <div class="case-card tier-gold" data-name="Золотой">
                    <div class="case-icon-placeholder">💎</div>
                    <div class="case-name">Золотой</div>
                </div>

            </div>
        </div>
    </div>

    <div id="gamePlayScreen" class="screen">
        <div class="screen-header">
            <button class="btn-back" id="btnBackToCases">⬅</button>
            <div class="screen-title" id="gameScreenTitle">Подбор кода</div>
        </div>

        <div class="game-screen-content">
            <div class="radar-panel">
                <div class="radar-value" id="radarDisplay">---</div>
            </div>

            <div class="lock-container">
                <div class="drum-column">
                    <button class="drum-btn" data-drum="0" data-dir="1">▲</button>
                    <div class="drum-display" id="drum-0">1</div>
                    <button class="drum-btn" data-drum="0" data-dir="-1">▼</button>
                </div>
                <div class="drum-column">
                    <button class="drum-btn" data-drum="1" data-dir="1">▲</button>
                    <div class="drum-display" id="drum-1">1</div>
                    <button class="drum-btn" data-drum="1" data-dir="-1">▼</button>
                </div>
                <div class="drum-column">
                    <button class="drum-btn" data-drum="2" data-dir="1">▲</button>
                    <div class="drum-display" id="drum-2">1</div>
                    <button class="drum-btn" data-drum="2" data-dir="-1">▼</button>
                </div>
            </div>

            <button class="btn-action-submit" id="btnSubmitCode">Ввести код</button>
        </div>
    </div>

</div>

<script>
    // Элементы навигации
    const mainMenuScreen = document.getElementById('mainMenuScreen');
    const casesScreen = document.getElementById('casesScreen');
    const gamePlayScreen = document.getElementById('gamePlayScreen');

    function showScreen(screen) {
        mainMenuScreen.classList.remove('active');
        casesScreen.classList.remove('active');
        gamePlayScreen.classList.remove('active');
        screen.classList.add('active');
    }

    // Привязка кликов
    document.getElementById('btnOpenSafes').addEventListener('click', () => showScreen(casesScreen));
    document.getElementById('btnBackToMenu').addEventListener('click', () => showScreen(mainMenuScreen));
    document.getElementById('btnBackToCases').addEventListener('click', () => showScreen(casesScreen));

    let currentSecretCode = [3, 5, 7];
    let currentDrumValues = [1, 1, 1];

    document.querySelectorAll('.case-card').forEach(card => {
        card.addEventListener('click', () => {
            const name = card.getAttribute('data-name');
            document.getElementById('gameScreenTitle').innerText = name;
            
            currentDrumValues = [1, 1, 1];
            document.getElementById('drum-0').innerText = "1";
            document.getElementById('drum-1').innerText = "1";
            document.getElementById('drum-2').innerText = "1";
            document.getElementById('radarDisplay').innerText = "---";
            
            showScreen(gamePlayScreen);
        });
    });

    document.querySelectorAll('.drum-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            const idx = parseInt(btn.getAttribute('data-drum'));
            const dir = parseInt(btn.getAttribute('data-dir'));
            
            let val = currentDrumValues[idx] + dir;
            if (val > 9) val = 1;
            if (val < 1) val = 9;
            
            currentDrumValues[idx] = val;
            document.getElementById(`drum-${idx}`).innerText = val;
        });
    });

    document.getElementById('btnSubmitCode').addEventListener('click', () => {
        let matches = 0;
        for(let i=0; i<3; i++) {
            if(currentDrumValues[i] === currentSecretCode[i]) matches++;
        }
        let percent = Math.round((matches / 3) * 100);
        document.getElementById('radarDisplay').innerText = percent + "%";
    });
</script>

</body>
</html>
