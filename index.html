<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StarVault - Меню</title>
    <style>
        :root {
            --bg-dark: #070a12;
            --panel-bg: rgba(19, 26, 38, 0.75);
            --accent-blue: #00e5ff;
            --accent-gold: #ffc107;
            --text-main: #ffffff;
            --text-muted: #707e94;
            
            --bronze: #cd7f32;
            --silver: #c0c0c0;
            --gold: #ffd700;

            --radar-red: #ff3d71;
            --radar-yellow: #ffaa00;
            --radar-green: #00e676;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #020408;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .app-container {
            width: 100%;
            max-width: 390px;
            height: 700px;
            background-color: var(--bg-dark);
            background-image: url('IMG_20260719_173450.png');
            background-size: cover;
            background-position: center;
            border: 2px solid #1f293d;
            border-radius: 28px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
            overflow: hidden;
        }

        .screen {
            display: none;
            flex-direction: column;
            height: 100%;
            width: 100%;
            z-index: 5;
        }

        .screen-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .btn-back {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background-color: var(--panel-bg);
            border: 2px solid #243147;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .screen-title {
            font-size: 20px;
            font-weight: 800;
            text-transform: uppercase;
            color: var(--accent-blue);
        }

        /* МЕНЮ */
        .right-sidebar {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 10;
        }

        .circle-button {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background-color: var(--panel-bg);
            border: 2px solid #243147;
            color: var(--text-main);
            font-size: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .main-action-zone {
            margin-top: 150px;
            margin-bottom: 20px;
        }

        .main-button {
            width: 100%;
            height: 160px;
            border: 2px solid var(--accent-blue);
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(0, 229, 255, 0.3);
            background-color: var(--panel-bg);
            background-image: linear-gradient(rgba(10, 14, 23, 0.2), rgba(10, 14, 23, 0.6)), 
                              url('IMG_20260719_172011_593.jpg');
            background-size: cover;
            background-position: center;
        }

        .main-button .title {
            font-size: 22px;
            font-weight: 800;
            text-transform: uppercase;
            color: #fff;
        }

        .middle-zone {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .mid-button {
            height: 100px;
            background-color: var(--panel-bg);
            border: 2px solid #243147;
            border-radius: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .btn-locked {
            color: var(--text-muted);
            background-color: rgba(19, 26, 38, 0.4);
            border-color: #1c2535;
        }

        .btn-pvp {
            border-color: var(--accent-gold);
            color: #fff;
        }

        .bottom-zone {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: auto;
        }

        .bottom-button {
            height: 85px;
            background-color: var(--panel-bg);
            border: 2px solid #243147;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
