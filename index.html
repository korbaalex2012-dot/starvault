<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Главное Меню</title>
    <style>
        :root {
            --bg-dark: #070a12;
            --panel-bg: rgba(19, 26, 38, 0.75);
            --accent-blue: #00e5ff;
            --accent-gold: #ffc107;
            --text-main: #ffffff;
            --text-muted: #707e94;
            
            /* Цвета для тиров сейфов */
            --tier-bronze: #cd7f32;
            --tier-silver: #b5b7bb;
            --tier-gold: #ffd700;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #020408;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        /* Контейнер приложения */
        .app-container {
            width: 100%;
            max-width: 390px;
            height: 700px;
            background-image: url('IMG_20260719_173450.png');
            background-size: cover;
            background-position: center;
            border: 2px solid #1f293d;
            border-radius: 28px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
            overflow: hidden;
        }

        /* Экраны */
        .screen {
            display: none;
            flex-direction: column;
            height: 100%;
            width: 100%;
        }

        .screen.active {
            display: flex;
        }

        /* --- СТИЛИ ГЛАВНОГО МЕНЮ (ЛОББИ) --- */
        .right-sidebar {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 10;
        }

        .circle-button {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background-color: var(--panel-bg);
            border: 2px solid #243147;
            color: var(--text-main);
            font-size: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }

        .main-action-zone {
            margin-top: 150px;
            margin-bottom: 20px;
            z-index: 5;
        }

        .main-button {
            width: 100%;
            height: 160px;
            border: 2px solid var(--accent-blue);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(0, 229, 255, 0.3);
            background-image: linear-gradient(rgba(10, 14, 23, 0.2), rgba(10, 14, 23, 0.6)), 
                              url('IMG_20260719_172011_593.jpg');
            background-size: cover;
            background-position: center;
            position: relative;
            overflow: hidden;
            transition: transform 0.1s ease;
