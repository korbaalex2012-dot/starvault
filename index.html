<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Главное Меню</title>
    <style>
        :root {
            --bg-dark: #0a0e17;
            --panel-bg: #131a26;
            --accent-blue: #00e5ff;
            --accent-gold: #ffc107;
            --text-main: #ffffff;
            --text-muted: #707e94;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        /* Контейнер приложения (под мобильный экран) */
        .app-container {
            width: 100%;
            max-width: 390px;
            height: 700px;
            background: linear-gradient(180deg, #101622 0%, #0a0e17 100%);
            border: 2px solid #1f293d;
            border-radius: 28px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
        }

        /* 1. Верхний блок с круглыми кнопками справа (вертикальный стек) */
        .right-sidebar {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 10;
        }

        .circle-button {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background-color: var(--panel-bg);
            border: 2px solid #243147;
            color: var(--text-main);
            font-size: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        /* 2. Центральная большая плита (Главная кнопка) */
        .main-action-zone {
            margin-top: 150px; /* Отступ сверху, чтобы не перекрывать боковые кнопки */
            margin-bottom: 20px;
        }

        .main-button {
            width: 100%;
            height: 140px;
            background-color: var(--panel-bg);
            border: 2px solid var(--accent-blue);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.15);
        }

        .main-button .title {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #fff;
            text-shadow: 0 0 8px rgba(0, 229, 255, 0.6);
        }

        /* 3. Средний блок (Придумай сам и PVP) */
        .middle-zone {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .mid-button {
            height: 100px;
            background-color: var(--panel-bg);
            border: 2px solid #243147;
            border-radius: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            text-align: center;
            padding: 10px;
        }

        .btn-locked {
            border-color: #1c2535;
            color: var(--text-muted);
            cursor: not-allowed;
        }

        .btn-pvp {
            border-color: var(--accent-gold);
            color: #fff;
            box-shadow: 0 0 10px rgba(255, 193, 7, 0.1);
        }

        /* 4. Нижний блок (Дейлик и Магазин) */
        .bottom-zone {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: auto; /* Жестко прижимает к самому низу экрана */
        }

        .bottom-button {
            height: 85px;
            background-color: var(--panel-bg);
            border: 2px solid #243147;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .bottom-button span:first-child {
            font-size: 22px;
        }
    </style>
</head>
<body>

<div class="app-container">

    <div class="right-sidebar">
        <div class="circle-button">⚙️</div>
        <div class="circle-button">🏆</div>
        <div class="circle-button">🌐</div>
    </div>

    <div class="main-action-zone">
        <div class="main-button">
            <span class="title">Хакнуть систему</span>
        </div>
    </div>

    <div class="middle-zone">
        <div class="mid-button btn-locked">Скоро...</div>
        <div class="mid-button btn-pvp">PVP Дуэли</div>
    </div>

    <div class="bottom-zone">
        <div class="bottom-button">
            <span>🎁</span>
            <span>Дейли</span>
        </div>
        <div class="bottom-button">
            <span>🛒</span>
            <span>Магазин</span>
        </div>
    </div>

</div>

</body>
</html>
