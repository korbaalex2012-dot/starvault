<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StarVault VIP</title>
    <script src="https://telegram.org"></script>
    <style>
        body { background: radial-gradient(circle at center, #0f172a, #020617); color: #f8fafc; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; text-align: center; margin: 0; padding: 20px; user-select: none; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .game-container { width: 100%; max-width: 360px; background: rgba(30, 41, 59, 0.4); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); padding: 20px 15px; border-radius: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
        .header-stats { display: flex; justify-content: space-around; background: rgba(15, 23, 42, 0.6); padding: 12px; border-radius: 16px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.05); }
        .stat-box { font-size: 15px; font-weight: 800; letter-spacing: 0.5px; display: flex; align-items: center; gap: 6px; }
        .jackpot { color: #f59e0b; text-shadow: 0 0 12px rgba(245, 158, 11, 0.5); font-size: 16px; }
        .coins { color: #38bdf8; text-shadow: 0 0 12px rgba(56, 189, 248, 0.5); }
        .tabs { display: flex; justify-content: center; gap: 6px; margin-bottom: 20px; width: 100%; }
        .tab { background: rgba(15, 23, 42, 0.5); border: 1px solid rgba(255,255,255,0.05); color: #94a3b8; padding: 10px 4px; border-radius: 12px; cursor: pointer; flex: 1; font-size: 10px; font-weight: 700; text-transform: uppercase; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); letter-spacing: 0.5px; }
        .tab.active { background: #10b981; border-color: #10b981; color: #fff; box-shadow: 0 0 15px rgba(16, 185, 129, 0.4); }
        .safe-zone { background: linear-gradient(145deg, #1e293b, #0f172a); border: 1px solid rgba(255,255,255,0.1); border-radius: 24px; padding: 30px 15px; margin-bottom: 20px; position: relative; box-shadow: inset 0 2px 4px rgba(255,255,255,0.05); }
        .digits { display: flex; justify-content: center; gap: 14px; margin-bottom: 25px; }
        .digit-btn { display: flex; flex-direction: column; align-items: center; }
        .arrow { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); color: #94a3b8; width: 44px; height: 36px; cursor: pointer; font-size: 16px; border-radius: 8px; transition: all 0.2s; display: flex; align-items: center; justify-content: center; }
        .arrow:active { background: rgba(255,255,255,0.1); transform: scale(0.9); color: #fff; }
        .num { font-size: 32px; font-weight: 800; font-family: monospace; margin: 12px 0; width: 44px; height: 50px; background: #020617; display: flex; align-items: center; justify-content: center; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); color: #10b981; text-shadow: 0 0 10px rgba(16, 185, 129, 0.4); box-shadow: inset 0 4px 8px rgba(0,0,0,0.5); }
        .main-btn { background: #10b981; border: none; color: #fff; padding: 16px; font-size: 16px; font-weight: 800; border-radius: 14px; cursor: pointer; width: 100%; text-transform: uppercase; letter-spacing: 1px; transition: all 0.3s; box-shadow: 0 6px 20px rgba(16,185,129,0.3); }
        .main-btn:active { transform: scale(0.98); box-shadow: 0 2px 10px rgba(16,185,129,0.2); }
        .hint-box { color: #94a3b8; min-height: 48px; font-size: 13px; padding: 10px; background: rgba(15, 23, 42, 0.4); border-radius: 12px; border: 1px solid rgba(255,255,255,0.03); line-height: 1.4; display: flex; align-items: center; justify-content: center; }
        .promo-zone { margin-top: 15px; display: flex; gap: 8px; justify-content: center; width: 100%; }
        .promo-input { background: #020617; border: 1px solid rgba(255,255,255,0.1); color: #fff; padding: 12px; border-radius: 10px; width: 60%; text-align: center; font-weight: 700; font-size: 14px; letter-spacing: 1px; }
        .promo-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #fff; padding: 12px 18px; border-radius: 10px; cursor: pointer; font-weight: 700; transition: all 0.2s; }
        .promo-btn:active { background: rgba(255,255,255,0.1); }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header-stats">
            <div class="stat-box jackpot">💰 БАНК: <span id="bank-counter">4,250</span> ⭐️</div>
            <div class="stat-box coins" id="coins-display" style="display:none;">🪙 МОНЕТЫ: <span id="user-coins">100</span></div>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="changeSafe('bronze', 5)">Бронза<br>5 ⭐️</button>
            <button class="tab" onclick="changeSafe('silver', 50)">Серебро<br>50 ⭐️</button>
            <button class="tab" onclick="changeSafe('gold', 500)">Золото<br>500 ⭐️</button>
            <button class="tab" onclick="changeSafe('friend', 0)">С другом<br>(Монеты)</button>
        </div>

        <div class="safe-zone">
            <div class="digits">
                <div class="digit-btn"><button class="arrow" onclick="move(0,1)">▲</button><span class="num" id="d0">0</span><button class="arrow" onclick="move(0,-1)">▼</button></div>
                <div class="digit-btn"><button class="arrow" onclick="move(1,1)">▲</button><span class="num" id="d1">0</span><button class="arrow" onclick="move(1,-1)">▼</button></div>
                <div class="digit-btn"><button class="arrow" onclick="move(2,1)">▲</button><span class="num" id="d2">0</span><button class="arrow" onclick="move(2,-1)">▼</button></div>
                <div class="digit-btn"><button class="arrow" onclick="move(3,1)">▲</button><span class="num" id="d3">0</span><button class="arrow" onclick="move(3,-1)">▼</button></div>
            </div>
            <button class="main-btn" id="action-btn" onclick="checkCode()">Взломать за 5 ⭐️</button>
        </div>

        <div class="hint-box" id="hint">Система заперта. Начните подбор кода, чтобы взломать замок и забрать куш!</div>

        <div class="promo-zone" id="promo-area" style="display:none;">
            <input type="text" class="promo-input" id="promo-field" placeholder="ПРОМОКОД">
            <button class="promo-btn" onclick="activatePromo()">ОК</button>
        </div>
    </div>
        <script>
        let vaultCodes = {
            bronze:,
            silver:,
            gold:,
            friend:
        };
        
        let currentCode =;
        let currentMode = 'bronze';
        let currentCost = 5;
        let coins = 100;

        function move(idx, dir) {
            currentCode[idx] = (currentCode[idx] + dir + 10) % 10;
            document.getElementById('d' + idx).innerText = currentCode[idx];
        }

        function changeSafe(type, cost) {
            currentMode = type;
            currentCost = cost;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            if(event) event.currentTarget.classList.add('active');
            
            let btn = document.getElementById('action-btn');
            let nums = document.querySelectorAll('.num');
            
            if(type === 'friend') {
                btn.innerText = `ИГРАТЬ (10 🪙)`;
                btn.style.background = '#38bdf8';
                btn.style.boxShadow = '0 6px 20px rgba(56,189,248,0.3)';
                nums.forEach(n => { n.style.color = '#38bdf8'; n.style.textShadow = '0 0 10px rgba(56,189,248,0.4)'; });
                document.getElementById('coins-display').style.display = 'block';
                document.getElementById('promo-area').style.display = 'flex';
                document.getElementById('hint').innerText = "Режим тренировки активирован. Подберите код, используя логику!";
            } else {
                btn.innerText = `Взломать за ${cost} ⭐️`;
                let mainColor = type === 'bronze' ? '#10b981' : (type === 'silver' ? '#f59e0b' : '#ef4444');
                btn.style.background = mainColor;
                btn.style.boxShadow = `0 6px 20px ${mainColor}4d`;
                nums.forEach(n => { n.style.color = mainColor; n.style.textShadow = `0 0 10px ${mainColor}66`; });
                
                document.getElementById('coins-display').style.display = 'none';
                document.getElementById('promo-area').style.display = 'none';
                let fakeBank = type === 'bronze' ? 4250 : (type === 'silver' ? 45300 : 258000);
                document.getElementById('bank-counter').innerText = fakeBank.toLocaleString();
                document.getElementById('hint').innerText = "Шифр зафиксирован. Каждая попытка выдает точные подсказки положения цифр!";
            }
        }

        function checkCode() {
            let targetCode = vaultCodes[currentMode];
            
            if(currentMode === 'friend') {
                if(coins < 10) {
                    document.getElementById('hint').innerText = "❌ Недостаточно монет! Используйте промокод STAR или BONUS.";
                    return;
                }
                coins -= 10;
                document.getElementById('user-coins').innerText = coins;
            }

            let correctDigits = 0;
            let correctPositions = 0;
            
            for(let i=0; i<4; i++) {
                if(currentCode[i] === targetCode[i]) correctPositions++;
                if(targetCode.includes(currentCode[i])) correctDigits++;
            }

            let hintElement = document.getElementById('hint');
            if(correctPositions === 4) {
                if(currentMode === 'friend') {
                    coins += 100;
                    document.getElementById('user-coins').innerText = coins;
                    hintElement.innerHTML = "<span style='color:#38bdf8; font-weight:bold;'>💥 ВЗЛОМАНО! Вы победили и забрали +100 монет!</span>";
                } else {
                    hintElement.innerHTML = "<span style='color:#f59e0b; font-weight:bold;'>💥 БУМ! СЕЙФ ВЗОРВАН! ВСЕ ЗВЁЗДЫ ВАШИ!</span>";
                    alert("ДЖЕКПОТ! Вы взломали систему!");
                }
                vaultCodes[currentMode] = Array.from({length: 4}, () => Math.floor(Math.random() * 10));
            } else {
                hintElement.innerHTML = `⚙️ <b>Анализ кода:</b><br>Цифр совпало: <span style='color:#fff'>${correctDigits}</span> | На своих местах: <span style='color:#10b981'>${correctPositions}</span>`;
            }
        }

        function activatePromo() {
            let input = document.getElementById('promo-field').value.trim().toUpperCase();
            if(input === 'STAR' || input === 'BONUS') {
                coins += 50;
                document.getElementById('user-coins').innerText = coins;
                document.getElementById('hint').innerText = "✅ Промокод активирован! Получено +50 монет.";
                document.getElementById('promo-field').value = "";
            } else {
                document.getElementById('hint').innerText = "❌ Код не существует или устарел!";
            }
        }
    </script>
</body>
</html>
