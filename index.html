<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StarVault 3D VIP</title>
    <script src="https://telegram.org"></script>
    <style>
        body { 
            background: #020617; 
            color: #f8fafc; 
            font-family: 'Segoe UI', Roboto, sans-serif; 
            text-align: center; 
            margin: 0; 
            padding: 0; 
            user-select: none; 
            min-height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
        }
        .game-container { 
            width: 100vw; 
            height: 100vh; 
            max-width: 450px; 
            max-height: 800px; 
            position: relative;
            background: url('IMG_20260719_114541_492.jpg') no-repeat center center;
            background-size: cover;
            overflow: hidden;
        }
        /* Невидимые, но кликабельные зоны поверх премиум-картинки */
        .tabs-overlay {
            position: absolute;
            top: 64%;
            left: 5%;
            width: 90%;
            height: 20%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 10px;
        }
        .hidden-tab {
            background: rgba(255, 255, 255, 0.01);
            border: 2px solid transparent;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .hidden-tab.active {
            border-color: #fbbf24;
            background: rgba(251, 191, 36, 0.1);
            box-shadow: 0 0 15px rgba(251, 191, 36, 0.3);
        }
        .display-overlay {
            position: absolute;
            top: 37.5%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            gap: 18px;
        }
        .digit-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .arrow-up, .arrow-down {
            background: rgba(255, 255, 255, 0.05);
            border: none;
            color: #fbbf24;
            font-size: 20px;
            cursor: pointer;
            padding: 2px 10px;
            font-weight: 900;
            text-shadow: 0 0 8px #fbbf24;
        }
        .arrow-up:active, .arrow-down:active {
            transform: scale(1.3);
        }
        .digital-num {
            font-size: 52px;
            font-weight: 900;
            font-family: monospace;
            color: #fbbf24;
            text-shadow: 0 0 20px rgba(251, 191, 36, 0.9);
            margin: 5px 0;
            user-select: none;
        }
        .info-panel {
            position: absolute;
            bottom: 4%;
            left: 5%;
            width: 90%;
            background: rgba(2, 6, 23, 0.8);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 12px;
            border-radius: 14px;
            font-size: 13px;
            color: #94a3b8;
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body>
    <div class="game-container">
        <!-- Цифры кода накладываются ровно на табло сейфа из картинки -->
        <div class="display-overlay">
            <div class="digit-container"><button class="arrow-up" onclick="move(0,1)">▲</button><span class="digital-num" id="d0">0</span><button class="arrow-down" onclick="move(0,-1)">▼</button></div>
            <div class="digit-container"><button class="arrow-up" onclick="move(1,1)">▲</button><span class="digital-num" id="d1">0</span><button class="arrow-down" onclick="move(1,-1)">▼</button></div>
            <div class="digit-container"><button class="arrow-up" onclick="move(2,1)">▲</button><span class="digital-num" id="d2">0</span><button class="arrow-down" onclick="move(2,-1)">▼</button></div>
            <div class="digit-container"><button class="arrow-up" onclick="move(3,1)">▲</button><span class="digital-num" id="d3">0</span><button class="arrow-down" onclick="move(3,-1)">▼</button></div>
        </div>

        <!-- Кликабельные зоны ложатся прямо на 4 неоновые кнопки из картинки -->
        <div class="tabs-overlay">
            <div class="hidden-tab active" onclick="changeSafe('bronze', 5)"></div>
            <div class="hidden-tab" onclick="changeSafe('friend', 0)"></div>
            <div class="hidden-tab" onclick="changeSafe('silver', 50)"></div>
            <div class="hidden-tab" onclick="changeSafe('gold', 500)"></div>
        </div>

        <div class="info-panel" id="hint">
            Сейф заперт. Крути золотые стрелочки прямо на табло, чтобы взломать шифр и забрать джекпот!
        </div>
    </div>

    <script>
        let vaultCodes = {
            "bronze": [Math.floor(Math.random()*10), Math.floor(Math.random()*10), Math.floor(Math.random()*10), Math.floor(Math.random()*10)],
            "silver": [Math.floor(Math.random()*10), Math.floor(Math.random()*10), Math.floor(Math.random()*10), Math.floor(Math.random()*10)],
            "gold": [Math.floor(Math.random()*10), Math.floor(Math.random()*10), Math.floor(Math.random()*10), Math.floor(Math.random()*10)],
            "friend": [Math.floor(Math.random()*10), Math.floor(Math.random()*10), Math.floor(Math.random()*10), Math.floor(Math.random()*10)]
        };
        
        let currentCode =;
        let currentMode = 'bronze';

        function move(idx, dir) {
            currentCode[idx] = (currentCode[idx] + dir + 10) % 10;
            document.getElementById('d' + idx).innerText = currentCode[idx];
            
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.HapticFeedback.impactOccurred('light');
            }
        }

        function changeSafe(type, cost) {
            currentMode = type;
            document.querySelectorAll('.hidden-tab').forEach(t => t.classList.remove('active'));
            if(event && event.currentTarget) event.currentTarget.classList.add('active');
            
            let hint = document.getElementById('hint');
            if(type === 'friend') {
                hint.innerHTML = "🎯 <b>Режим «С другом» активен!</b><br>Крути диски, попытка стоит 10 монет.";
            } else {
                hint.innerHTML = `💰 <b>Сейф обновлен! Ставка: ${cost} ★</b><br>Каждая попытка увеличивает главный джекпот!`;
            }
        }
    </script>
</body>
</html>
