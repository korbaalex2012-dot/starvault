<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>StarVault: Взлом Сейфов 🔓</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0d0f17;
      --panel: #161925;
      --accent: #00f0ff;
      --accent-gold: #ffd700;
      --text: #ffffff;
      --text-dim: #8b92b2;
      --danger: #ff0055;
      --success: #00ff88;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background: var(--bg); color: var(--text); padding-bottom: 70px; overflow-x: hidden; }
    
    header { background: var(--panel); padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #282d42; }
    .user-info { display: flex; align-items: center; gap: 10px; }
    .avatar { width: 40px; height: 40px; border-radius: 50%; background: #282d42; display: flex; align-items: center; justify-content: center; font-weight: bold; border: 2px solid var(--accent); }
    .balance { background: #0004; padding: 6px 12px; border-radius: 20px; border: 1px solid #282d42; font-weight: bold; color: var(--accent-gold); display: flex; align-items: center; gap: 5px; }

    .nav-tabs { display: flex; background: var(--panel); position: fixed; bottom: 0; left: 0; right: 0; height: 60px; border-top: 1px solid #282d42; z-index: 100; }
    .tab-btn { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; background: none; border: none; color: var(--text-dim); font-size: 11px; gap: 4px; cursor: pointer; }
    .tab-btn.active { color: var(--accent); }
    .tab-btn span { font-size: 18px; }

    .page { display: none; padding: 15px; }
    .page.active { display: block; }

    /* GRID СЕЙФОВ */
    .safes-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 15px; }
    .safe-card { background: var(--panel); border: 1px solid #282d42; border-radius: 12px; padding: 10px; text-align: center; position: relative; cursor: pointer; transition: 0.2s; }
    .safe-card:active { transform: scale(0.95); }
    .safe-icon { font-size: 32px; margin-bottom: 5px; }
    .safe-title { font-size: 12px; font-weight: bold; }
    .safe-reward { font-size: 10px; color: var(--accent-gold); margin-top: 4px; }

    /* МОДАЛКА */
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(5px); z-index: 200; align-items: center; justify-content: center; padding: 20px; }
    .modal.active { display: flex; }
    .modal-content { background: var(--panel); border: 1px solid var(--accent); border-radius: 16px; width: 100%; max-width: 360px; padding: 20px; text-align: center; position: relative; }
    .close-btn { position: absolute; top: 10px; right: 15px; background: none; border: none; color: var(--text-dim); font-size: 20px; cursor: pointer; }

    /* КЛАВИАТУРА СЕЙФА */
    .digits-display { background: #000; color: var(--accent); font-size: 24px; font-family: monospace; letter-spacing: 5px; padding: 10px; border-radius: 8px; margin: 15px 0; border: 1px solid #282d42; height: 50px; display: flex; align-items: center; justify-content: center; }
    .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .key-btn { background: #222738; border: 1px solid #282d42; color: #fff; padding: 12px; font-size: 18px; font-weight: bold; border-radius: 8px; cursor: pointer; }
    .key-btn:active { background: var(--accent); color: #000; }

    .btn { background: var(--accent); color: #000; border: none; padding: 12px 20px; font-weight: bold; border-radius: 8px; width: 100%; margin-top: 10px; cursor: pointer; }
    .btn-danger { background: var(--danger); color: #fff; }
  </style>
</head>
<body>

  <header>
    <div class="user-info">
      <div class="avatar" id="uAvatar">😎</div>
      <div>
        <div id="uName" style="font-weight: bold; font-size: 14px;">Игрок</div>
        <div id="uTitle" style="font-size: 10px; color: var(--accent);">[Новичок]</div>
      </div>
    </div>
    <div class="balance">🪙 <span id="uCoins">100</span></div>
  </header>

  <div id="page-safes" class="page active">
    <h3>🔓 Выберите сейф для взлома</h3>
    <div class="safes-grid" id="safesGrid"></div>
  </div>

  <div id="page-inventory" class="page">
    <h3>🎒 Ваш Инвентарь</h3>
    <div id="inventoryList" style="margin-top: 15px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;"></div>
  </div>

  <div id="page-pvp" class="page">
    <h3>⚔️ PVP Дуэль & Маркет</h3>
    <p style="color: var(--text-dim); font-size: 12px; margin-top: 5px;">Бросьте вызов другим взломщикам!</p>
    <button class="btn" style="margin-top: 15px;" onclick="startPvpMatch()">Искать соперника (50 🪙)</button>
  </div>

  <nav class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('safes', this)"><span>🔓</span>Сейфы</button>
    <button class="tab-btn" onclick="switchTab('inventory', this)"><span>🎒</span>Предметы</button>
    <button class="tab-btn" onclick="switchTab('pvp', this)"><span>⚔️</span>PVP</button>
  </nav>

  <div class="modal" id="gameModal">
    <div class="modal-content">
      <button class="close-btn" onclick="closeGame()">✕</button>
      <h3 id="gSafeName">Сейф</h3>
      <div id="gSafeMode" style="font-size: 12px; color: var(--text-dim); margin-top: 4px;">Попыток: 5</div>
      <div class="digits-display" id="gDisplay">____</div>
      <div id="gameHint" style="font-size: 11px; color: var(--accent-gold); height: 18px; margin-bottom: 5px;"></div>
      
      <div class="keypad">
        <button class="key-btn" onclick="pressNum('1')">1</button>
        <button class="key-btn" onclick="pressNum('2')">2</button>
        <button class="key-btn" onclick="pressNum('3')">3</button>
        <button class="key-btn" onclick="pressNum('4')">4</button>
        <button class="key-btn" onclick="pressNum('5')">5</button>
        <button class="key-btn" onclick="pressNum('6')">6</button>
        <button class="key-btn" onclick="pressNum('7')">7</button>
        <button class="key-btn" onclick="pressNum('8')">8</button>
        <button class="key-btn" onclick="pressNum('9')">9</button>
        <button class="key-btn" onclick="clearNum()">❌</button>
        <button class="key-btn" onclick="pressNum('0')">0</button>
        <button class="key-btn" onclick="submitCode()">🔓</button>
      </div>
    </div>
  </div>
   <script>
    // 1. ИНИЦИАЛИЗАЦИЯ И ДАННЫЕ
    let tg = window.Telegram ? window.Telegram.WebApp : null;
    try {
      if (tg) {
        tg.ready();
        tg.expand();
      }
    } catch(e) {
      console.log("Запуск вне Telegram");
    }

    let userCoins = 100;
    let inventory = [];

    const SAFES_DATA = [
      { id: 1, name: "Деревянный сейф", icon: "📦", len: 3, limit: 5, mode: "logic", baseReward: 50 },
      { id: 2, name: "Железный сейф", icon: "⚙️", len: 4, limit: 5, mode: "logic", baseReward: 150 },
      { id: 3, name: "Стальной сейф", icon: "🛡️", len: 4, limit: 30, mode: "time", baseReward: 300 },
      { id: 4, name: "Золотой сейф", icon: "🏆", len: 4, limit: 4, mode: "logic", baseReward: 600 },
      { id: 5, name: "Алмазный сейф", icon: "💎", len: 5, limit: 40, mode: "time", baseReward: 1200 },
      { id: 6, name: "Хакерский сейф", icon: "💻", len: 5, limit: 3, mode: "logic", baseReward: 2500 }
    ];

    const ITEMS_POOL = [
      { name: "⚡ Отмычка", rarity: "Обычный", desc: "Дает +1 попытку" },
      { name: "🔍 Сканер кода", rarity: "Редкий", desc: "Подсказывает цифру" },
      { name: "👑 Золотая отмычка", rarity: "Легендарный", desc: "Увеличивает награду х2" }
    ];

    let activeSafe = null;
    let secretCode = "";
    let currentInput = "";
    let attemptsLeft = 0;
    let secondsLeft = 0;
    let gameTimer = null;

    // 2. ПЕРЕКЛЮЧЕНИЕ ВКЛАДОК
    function switchTab(tabName, btn) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      
      document.getElementById(`page-${tabName}`).classList.add('active');
      btn.classList.add('active');
    }

    // 3. ОТРИСОВКА СЕЙФОВ
    function renderSafes() {
      const grid = document.getElementById('safesGrid');
      grid.innerHTML = "";
      SAFES_DATA.forEach(s => {
        grid.innerHTML += `
          <div class="safe-card" onclick="openGame(${s.id})">
            <div class="safe-icon">${s.icon}</div>
            <div class="safe-title">${s.name}</div>
            <div class="safe-reward">+${s.baseReward} 🪙</div>
          </div>
        `;
      });
      updateUI();
    }

    function updateUI() {
      document.getElementById('uCoins').innerText = userCoins;
      renderInventory();
    }

    function renderInventory() {
      const list = document.getElementById('inventoryList');
      if (inventory.length === 0) {
        list.innerHTML = `<div style="grid-column: span 2; color: var(--text-dim); text-align: center; font-size: 12px; margin-top: 20px;">Инвентарь пуст. Взламывайте сейфы, чтобы выбить предметы!</div>`;
        return;
      }
      list.innerHTML = "";
      inventory.forEach(item => {
        list.innerHTML += `
          <div style="background: var(--panel); border: 1px solid #282d42; padding: 10px; border-radius: 10px; text-align: center;">
            <div style="font-size: 20px;">${item.name.split(' ')[0]}</div>
            <div style="font-weight: bold; font-size: 12px; margin-top: 4px;">${item.name}</div>
            <div style="font-size: 10px; color: var(--accent); margin-top: 2px;">${item.rarity}</div>
          </div>
        `;
      });
    }
         // 4. ИГРОВАЯ ЛОГИКА И НАСТРОЙКА РЕДКОГО ВЫПАДЕНИЯ
    function openGame(safeId) {
      activeSafe = SAFES_DATA.find(s => s.id === safeId);
      if (!activeSafe) return;

      secretCode = "";
      for (let i = 0; i < activeSafe.len; i++) {
        secretCode += Math.floor(Math.random() * 10);
      }

      currentInput = "";
      document.getElementById('gSafeName').innerText = `${activeSafe.icon} ${activeSafe.name}`;
      document.getElementById('gameHint').innerText = "";
      updateDisplay();

      if (activeSafe.mode === 'logic') {
        attemptsLeft = activeSafe.limit;
        document.getElementById('gSafeMode').innerText = `Попыток оставлось: ${attemptsLeft}`;
      } else {
        secondsLeft = activeSafe.limit;
        document.getElementById('gSafeMode').innerText = `Осталось времени: ${secondsLeft}с`;
        if (gameTimer) clearInterval(gameTimer);
        gameTimer = setInterval(() => {
          secondsLeft--;
          document.getElementById('gSafeMode').innerText = `Осталось времени: ${secondsLeft}с`;
          if (secondsLeft <= 0) {
            clearInterval(gameTimer);
            alert("⏰ Время вышло! Сейф заблокирован.");
            closeGame();
          }
        }, 1000);
      }

      document.getElementById('gameModal').classList.add('active');
    }

    function pressNum(num) {
      if (currentInput.length < activeSafe.len) {
        currentInput += num;
        updateDisplay();
      }
    }

    function clearNum() {
      currentInput = "";
      updateDisplay();
    }

    function updateDisplay() {
      let disp = currentInput;
      while (disp.length < activeSafe.len) disp += "_";
      document.getElementById('gDisplay').innerText = disp;
    }

    function submitCode() {
      if (currentInput.length !== activeSafe.len) return;

      if (currentInput === secretCode) {
        if (gameTimer) clearInterval(gameTimer);

        // Награда монетами
        userCoins += activeSafe.baseReward;

        // ЛОГИКА РЕДКОГО ВЫПАДЕНИЯ ПРЕДМЕТА (25% шанс)
        const dropChance = Math.random() * 100;
        let droppedItemMsg = "";

        if (dropChance <= 25) { // 25% УДАЧИ
          const randomItem = ITEMS_POOL[Math.floor(Math.random() * ITEMS_POOL.length)];
          inventory.push(randomItem);
          droppedItemMsg = `\n🎁 ВАУ! Тебе выпал редкий предмет: ${randomItem.name}!`;
        }

        alert(`🎉 ВЗЛОМ УСПЕШЕН!\nВы получили +${activeSafe.baseReward} 🪙${droppedItemMsg}`);
        closeGame();
        updateUI();
      } else {
        currentInput = "";
        updateDisplay();

        if (activeSafe.mode === 'logic') {
          attemptsLeft--;
          document.getElementById('gSafeMode').innerText = `Попыток осталось: ${attemptsLeft}`;
          
          let correctPos = 0;
          for (let i = 0; i < activeSafe.len; i++) {
            if (currentInput[i] === secretCode[i]) correctPos++;
          }
          document.getElementById('gameHint').innerText = "Неверный код! Попробуй еще.";

          if (attemptsLeft <= 0) {
            alert("❌ Попытки закончились! Сейф заблокирован.");
            closeGame();
          }
        } else {
          document.getElementById('gameHint').innerText = "Неверный код!";
        }
      }
    }

    function closeGame() {
      if (gameTimer) clearInterval(gameTimer);
      document.getElementById('gameModal').classList.remove('active');
    }

    function startPvpMatch() {
      if (userCoins < 50) {
        alert("Недостаточно монет для взноса!");
        return;
      }
      userCoins -= 50;
      updateUI();
      alert("⚔️ Поиск соперника... Попробуйте чуть позже!");
    }

    // СТАРТ ИГРЫ
    renderSafes();
  </script>
</body>
</html>
