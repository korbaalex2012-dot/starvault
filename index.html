<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>StarVault - Меню</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-dark: #070a12;
            --panel-bg: rgba(19, 26, 38, 0.85);
            --accent-blue: #00e5ff;
            --accent-gold: #ffc107;
            --text-main: #ffffff;
            --text-muted: #707e94;
            
            --bronze: #cd7f32;
            --silver: #c0c0c0;
            --gold: #ffd700;

            --radar-red: #ff3d71;
            --radar-yellow: #ffaa00;
            --radar-green: #00e676;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #020408;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .app-container {
            width: 100%;
            max-width: 390px;
            height: 680px;
            background-color: var(--bg-dark);
            background-image: url('IMG_20260719_173450.png');
            background-size: cover;
            background-position: center;
            border: 2px solid #1f293d;
            border-radius: 28px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
            overflow: hidden;
        }

        .screen {
            display: none;
            flex-direction: column;
            height: 100%;
            width: 100%;
            position: relative;
            z-index: 5;
        }

        .screen-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .btn-back {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background-color: var(--panel-bg);
            border: 2px solid #243147;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .screen-title {
            font-size: 20px;
            font-weight: 800;
            text-transform: uppercase;
            color: var(--accent-blue);
        }

        /* НАСТРОЙКИ */
        .settings-menu-wrapper {
            position: absolute;
            top: 15px;
            right: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 44px;
            z-index: 100;
        }

        .gear-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background-color: var(--panel-bg);
            border: 2px solid #243147;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            cursor: pointer;
            color: #fff;
        }

        .arrow-btn {
            width: 24px;
            height: 18px;
            background-color: rgba(19, 26, 38, 0.7);
            border: 1px solid #243147;
            border-radius: 0 0 8px 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 10px;
            color: var(--accent-blue);
            cursor: pointer;
            margin-top: -2px;
        }

        .settings-dropdown {
            display: none;
            flex-direction: column;
            gap: 8px;
            margin-top: 8px;
            width: 42px;
        }

        .settings-menu-wrapper.open .settings-dropdown {
            display: flex;
        }

        .sub-button {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background-color: var(--panel-bg);
            border: 2px solid #243147;
            color: #fff;
            font-size: 18px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }
                .main-action-zone {
            margin-top: 130px;
            margin-bottom: 20px;
        }

        .main-button {
            width: 100%;
            height: 150px;
            border: 2px solid var(--accent-blue);
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(0, 229, 255, 0.3);
            background-color: var(--panel-bg);
            background-image: linear-gradient(rgba(10, 14, 23, 0.2), rgba(10, 14, 23, 0.6)), 
                              url('IMG_20260719_172011_593.jpg');
            background-size: cover;
            background-position: center;
        }

        .main-button .title {
            font-size: 22px;
            font-weight: 800;
            text-transform: uppercase;
            color: #fff;
            pointer-events: none;
        }

        .middle-zone {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .mid-button {
            height: 90px;
            background-color: var(--panel-bg);
            border: 2px solid #243147;
            border-radius: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
        }

        .btn-assets { border-color: var(--accent-blue); color: #fff; }
        .btn-pvp { border-color: var(--accent-gold); color: #fff; }

        .bottom-zone {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: auto;
        }

        .bottom-button {
            height: 80px;
            background-color: var(--panel-bg);
            border: 2px solid #243147;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 4px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            color: #fff;
        }

        .bottom-button span {
            pointer-events: none;
        }

        /* КЕЙСЫ */
        .cases-grid-wrapper {
            flex: 1;
            overflow-y: auto;
        }

        .cases-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            padding-bottom: 20px;
        }

        .case-card {
            background-color: rgba(15, 22, 36, 0.85);
            border-radius: 16px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            cursor: pointer;
            color: #fff;
        }

        .case-card * {
            pointer-events: none;
        }

        .case-img {
            width: 70px;
            height: 70px;
            object-fit: contain;
            margin-bottom: 6px;
        }

        .tier-bronze { border: 2px solid var(--bronze); }
        .tier-silver { border: 2px solid var(--silver); }
        .tier-gold { border: 2px solid var(--accent-gold); }

        .case-name {
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        .case-price {
            font-size: 11px;
            color: var(--accent-blue);
            margin-bottom: 8px;
            background: rgba(0, 229, 255, 0.1);
            padding: 2px 6px;
            border-radius: 6px;
        }

        .case-jackpot { font-size: 12px; font-weight: 800; }
        .case-jackpot span { color: var(--accent-gold); }

        /* ИГРА */
        .game-screen-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 10px;
        }

        .radar-panel {
            width: 100%;
            background-color: rgba(15, 22, 36, 0.9);
            border: 2px solid #243147;
            border-radius: 16px;
            padding: 15px;
            text-align: center;
        }

        .radar-title {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .radar-value { font-size: 26px; font-weight: 900; color: var(--text-muted); }

        .lock-container {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin: 20px 0;
            width: 100%;
        }

        .drum-column {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            background: rgba(10, 15, 26, 0.85);
            border: 2px solid #1f293d;
            border-radius: 14px;
            padding: 6px 4px;
            flex: 1;
            max-width: 52px;
        }

        .drum-btn {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            border: 1px solid #2d3d5a;
            background: #162032;
            color: var(--accent-blue);
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .drum-display { font-size: 24px; font-weight: 900; width: 40px; text-align: center; }

        .btn-action-submit {
            width: 100%;
            height: 55px;
            background: linear-gradient(135deg, #00b0ff, #00e5ff);
            border: none;
            border-radius: 16px;
            color: #000;
            font-size: 18px;
            font-weight: 800;
            text-transform: uppercase;
            cursor: pointer;
        }

        /* АКТИВЫ */
        .assets-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background-color: rgba(15, 22, 36, 0.85);
            border: 2px solid #243147;
            border-radius: 16px;
            padding: 20px;
        }

        .balance-item {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>

<div class="app-container" id="appContainer">

    <div class="settings-menu-wrapper" id="settingsWrapper">
        <button class="gear-btn" onclick="toggleSettings()">⚙️</button>
        <button class="arrow-btn" onclick="toggleSettings()">▼</button>
        <div class="settings-dropdown">
            <button class="sub-button" onclick="closeSettings()">🏆</button>
            <button class="sub-button" onclick="closeSettings()">🌐</button>
        </div>
    </div>

    <div id="mainMenuScreen" class="screen" style="display: flex;">
        <div class="main-action-zone">
            <button class="main-button" onclick="openCasesScreen()">
                <span class="title">Открыть сейф</span>
            </button>
        </div>

        <div class="middle-zone">
            <button class="mid-button btn-assets" onclick="openAssetsScreen()">Активы</button>
            <button class="mid-button btn-pvp" onclick="openMainMenu()">PVP Дуэли</button>
        </div>

        <div class="bottom-zone">
            <button class="bottom-button" onclick="openMainMenu()"><span>🎁</span><span>Дейли</span></button>
            <button class="bottom-button" onclick="openMainMenu()"><span>🛒</span><span>Магазин</span></button>
        </div>
    </div>
        <div id="casesScreen" class="screen">
        <div class="screen-header">
            <button class="btn-back" onclick="openMainMenu()">⬅</button>
            <div class="screen-title">Выбор хранилища</div>
        </div>

        <div class="cases-grid-wrapper">
            <div class="cases-grid">
                <button class="case-card tier-bronze" onclick="selectCase('Деревянный', 'IMG_20260719_180634.png')">
                    <img src="IMG_20260719_180634.png" class="case-img" onerror="this.style.display='none'">
                    <div class="case-name">Деревянный</div>
                    <div class="case-price">⭐ 1 звезда</div>
                    <div class="case-jackpot">Куш: <span>140</span></div>
                </button>

                <button class="case-card tier-bronze" onclick="selectCase('Бронзовый', 'IMG_20260719_181100.png')">
                    <img src="IMG_20260719_181100.png" class="case-img" onerror="this.style.display='none'">
                    <div class="case-name">Бронзовый</div>
                    <div class="case-price">⭐ 3 звезды</div>
                    <div class="case-jackpot">Куш: <span>420</span></div>
                </button>

                <button class="case-card tier-bronze" onclick="selectCase('Медный', 'IMG_20260719_181706.png')">
                    <img src="IMG_20260719_181706.png" class="case-img" onerror="this.style.display='none'">
                    <div class="case-name">Медный</div>
                    <div class="case-price">⭐ 5 звёзд</div>
                    <div class="case-jackpot">Куш: <span>890</span></div>
                </button>

                <button class="case-card tier-silver" onclick="selectCase('Стальной', 'IMG_20260719_183142.png')">
                    <img src="IMG_20260719_183142.png" class="case-img" onerror="this.style.display='none'">
                    <div class="case-name">Стальной</div>
                    <div class="case-price">⭐ 10 звёзд</div>
                    <div class="case-jackpot">Куш: <span>1500</span></div>
                </button>

                <button class="case-card tier-silver" onclick="selectCase('Железный', 'IMG_20260719_183244.png')">
                    <img src="IMG_20260719_183244.png" class="case-img" onerror="this.style.display='none'">
                    <div class="case-name">Железный</div>
                    <div class="case-price">⭐ 25 звёзд</div>
                    <div class="case-jackpot">Куш: <span>3400</span></div>
                </button>

                <button class="case-card tier-silver" onclick="selectCase('Серебряный', 'IMG_20260719_183338.png')">
                    <img src="IMG_20260719_183338.png" class="case-img" onerror="this.style.display='none'">
                    <div class="case-name">Серебряный</div>
                    <div class="case-price">⭐ 50 звёзд</div>
                    <div class="case-jackpot">Куш: <span>7200</span></div>
                </button>

                <button class="case-card tier-gold" onclick="selectCase('Золотой', 'IMG_20260719_183351.png')">
                    <img src="IMG_20260719_183351.png" class="case-img" onerror="this.style.display='none'">
                    <div class="case-name">Золотой</div>
                    <div class="case-price">⭐ 100 звёзд</div>
                    <div class="case-jackpot">Куш: <span>15000</span></div>
                </button>
            </div>
        </div>
    </div>

    <div id="gamePlayScreen" class="screen">
        <div class="screen-header">
            <button class="btn-back" onclick="backToCasesFromGame()">⬅</button>
            <div class="screen-title" id="gameScreenTitle">Подбор кода</div>
        </div>

        <div class="game-screen-content">
            <div class="radar-panel">
                <div class="radar-title">Синхронизация с замком</div>
                <div class="radar-value" id="radarDisplay">---</div>
            </div>

            <div class="lock-container">
                <div class="drum-column">
                    <button class="drum-btn" onclick="changeDrum(0, 1)">▲</button>
                    <div class="drum-display" id="drum-0">1</div>
                    <button class="drum-btn" onclick="changeDrum(0, -1)">▼</button>
                </div>
                <div class="drum-column">
                    <button class="drum-btn" onclick="changeDrum(1, 1)">▲</button>
                    <div class="drum-display" id="drum-1">1</div>
                    <button class="drum-btn" onclick="changeDrum(1, -1)">▼</button>
                </div>
                <div class="drum-column">
                    <button class="drum-btn" onclick="changeDrum(2, 1)">▲</button>
                    <div class="drum-display" id="drum-2">1</div>
                    <button class="drum-btn" onclick="changeDrum(2, -1)">▼</button>
                </div>
                <div class="drum-column">
                    <button class="drum-btn" onclick="changeDrum(3, 1)">▲</button>
                    <div class="drum-display" id="drum-3">1</div>
                    <button class="drum-btn" onclick="changeDrum(3, -1)">▼</button>
                </div>
                <div class="drum-column">
                    <button class="drum-btn" onclick="changeDrum(4, 1)">▲</button>
                    <div class="drum-display" id="drum-4">1</div>
                    <button class="drum-btn" onclick="changeDrum(4, -1)">▼</button>
                </div>
            </div>

            <button class="btn-action-submit" onclick="checkCode()">Ввести код</button>
        </div>
    </div>

    <div id="assetsScreen" class="screen">
        <div class="screen-header">
            <button class="btn-back" onclick="openMainMenu()">⬅</button>
            <div class="screen-title">Ваши Активы</div>
        </div>
        
        <div class="assets-content">
            <div class="balance-item">
                <span>🪙 Монеты:</span>
                <span id="coinBal">0</span>
            </div>
            <div class="balance-item">
                <span>⭐ Звёзды:</span>
                <span id="starBal">0</span>
            </div>

            <div style="margin-top: auto; padding: 15px; border: 2px solid #243147; background: rgba(10, 15, 26, 0.85); border-radius: 12px; text-align: center;">
                <p style="font-size: 14px; margin-bottom: 12px;">Приглашай друзей и получай 🪙 10 монет!</p>
                <button id="btnInviteFriend" onclick="inviteFriend()" style="width: 100%; padding: 12px; background: linear-gradient(135deg, #00ffcc, #00b0ff); border: none; border-radius: 10px; color: #000; font-weight: 800; text-transform: uppercase; cursor: pointer;">Пригласить</button>
            </div>
        </div>
    </div>

</div>
<script>
    if (window.Telegram && window.Telegram.WebApp) {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
    }

    var userCoins = 0;
    var userStars = 0;

    var mainMenuScreen = document.getElementById('mainMenuScreen');
    var casesScreen = document.getElementById('casesScreen');
    var gamePlayScreen = document.getElementById('gamePlayScreen');
    var assetsScreen = document.getElementById('assetsScreen');
    var appContainer = document.getElementById('appContainer');
    var settingsWrapper = document.getElementById('settingsWrapper');

    function showScreen(screen) {
        mainMenuScreen.style.display = 'none';
        casesScreen.style.display = 'none';
        gamePlayScreen.style.display = 'none';
        assetsScreen.style.display = 'none';
        
        if (screen === mainMenuScreen) {
            settingsWrapper.style.display = 'flex';
        } else {
            settingsWrapper.style.display = 'none';
            settingsWrapper.classList.remove('open');
        }
        screen.style.display = 'flex';
    }

    function openMainMenu() {
        showScreen(mainMenuScreen);
    }

    function openCasesScreen() {
        showScreen(casesScreen);
    }

    function openAssetsScreen() {
        document.getElementById('coinBal').innerText = userCoins;
        document.getElementById('starBal').innerText = userStars;
        showScreen(assetsScreen);
    }

    function backToCasesFromGame() {
        appContainer.style.backgroundImage = "url('IMG_20260719_173450.png')";
        showScreen(casesScreen);
    }

    function toggleSettings() {
        settingsWrapper.classList.toggle('open');
    }

    function closeSettings() {
        settingsWrapper.classList.remove('open');
    }

    function inviteFriend() {
        var btn = document.getElementById('btnInviteFriend');
        btn.innerText = "ГОТОВО!";
        setTimeout(function(){ btn.innerText = "Пригласить"; }, 2000);
    }

    // Игровая логика
    var currentSecretCode = [1, 2, 3, 4, 5];
    var currentDrumValues = [1, 1, 1, 1, 1];
    var gameDifficulty = "hard";

    function selectCase(name, bgImg) {
        document.getElementById('gameScreenTitle').innerText = name;
        gameDifficulty = (name === "Деревянный" || name === "Бронзовый" || name === "Медный") ? "easy" : "hard";
        
        if (bgImg) {
            appContainer.style.backgroundImage = "linear-gradient(rgba(7, 10, 18, 0.75), rgba(7, 10, 18, 0.95)), url('" + bgImg + "')";
        }

        currentSecretCode = [];
        for(var i=0; i<5; i++) {
            currentSecretCode.push(Math.floor(Math.random() * 9) + 1);
        }
        
        currentDrumValues = [1, 1, 1, 1, 1];
        for(var i=0; i<5; i++) {
            document.getElementById('drum-' + i).innerText = "1";
        }
        
        var radar = document.getElementById('radarDisplay');
        radar.innerText = "---";
        radar.style.color = "var(--text-muted)";
        
        showScreen(gamePlayScreen);
    }

    function changeDrum(idx, dir) {
        var val = currentDrumValues[idx] + dir;
        if (val > 9) val = 1;
        if (val < 1) val = 9;
        
        currentDrumValues[idx] = val;
        document.getElementById('drum-' + idx).innerText = val;
    }

    function checkCode() {
        var exactMatches = 0;   
        var partialMatches = 0; 

        var sCopy = [currentSecretCode[0], currentSecretCode[1], currentSecretCode[2], currentSecretCode[3], currentSecretCode[4]];
        var dCopy = [currentDrumValues[0], currentDrumValues[1], currentDrumValues[2], currentDrumValues[3], currentDrumValues[4]];

        for (var i = 0; i < 5; i++) {
            if (dCopy[i] === sCopy[i]) {
                exactMatches++;
                sCopy[i] = 0; 
                dCopy[i] = -1;
            }
        }

        for (var i = 0; i < 5; i++) {
            if (dCopy[i] !== -1) {
                for (var j = 0; j < 5; j++) {
                    if (sCopy[j] === dCopy[i]) {
                        partialMatches++;
                        sCopy[j] = 0;
                        break;
                    }
                }
            }
        }

        var totalScore = 0;
        if (gameDifficulty === "easy") {
            totalScore = exactMatches * 20;
        } else {
            totalScore = (exactMatches * 20) + (partialMatches * 8);
        }

        if (totalScore > 100) totalScore = 100;

        var radar = document.getElementById('radarDisplay');
        
        if (exactMatches === 5) {
            radar.innerText = "УСПЕХ 100%";
            radar.style.color = "var(--radar-green)";
            setTimeout(function() {
                appContainer.style.backgroundImage = "url('IMG_20260719_173450.png')";
                showScreen(casesScreen);
            }, 1000);
        } else {
            radar.innerText = "СИГНАЛ: " + totalScore + "%";
            if (totalScore >= 60) {
                radar.style.color = "var(--radar-green)";
            } else if (totalScore >= 30) {
                radar.style.color = "var(--radar-yellow)";
            } else {
                radar.style.color = "var(--radar-red)";
            }
        }
    }
</script>
</body>
</html>
