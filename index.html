<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лобби Дуэлей — Сейфы</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --panel-bg: #161b22;
            --accent-color: #58a6ff;
            --star-color: #e3b341;
            --text-color: #c9d1d9;
            --button-disabled: #30363d;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .lobby-container {
            width: 100%;
            max-width: 500px;
            background: var(--panel-bg);
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        h1 {
            font-size: 20px;
            text-align: center;
            margin-bottom: 20px;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Список сейфов (плиты) */
        .duel-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .duel-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: border-color 0.2s;
        }

        .duel-card:hover {
            border-color: var(--accent-color);
        }

        .duel-info {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .nickname {
            font-weight: bold;
            color: #fff;
        }

        .meta-data {
            font-size: 14px;
            color: #8b949e;
        }

        .stake {
            color: var(--star-color);
            font-weight: bold;
        }

        /* Кнопка В бой (Пока некликабельная) */
        .btn-battle {
            background-color: var(--button-disabled);
            color: #8b949e;
            border: 1px solid #484f58;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: not-allowed;
            text-transform: uppercase;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        /* Эффект заглушки, показывающий, что кнопка ждет логики */
        .btn-battle::after {
            content: ' 🔒';
            font-size: 12px;
        }
    </style>
</head>
<body>

<div class="lobby-container">
    <h1>Общий список дуэлей (Лобби)</h1>
    
    <div class="duel-list">
        <div class="duel-card">
            <div class="duel-info">
                <div class="nickname">@cryptohacker_x</div>
                <div class="meta-data">Время: <span style="color: #ff7b72;">03:45</span></div>
                <div class="meta-data">Ставка: <span class="stake">50 ★</span></div>
            </div>
            <button class="btn-battle" disabled>В бой</button>
        </div>

        <div class="duel-card">
            <div class="duel-info">
                <div class="nickname">@cyber_alex</div>
                <div class="meta-data">Время: <span style="color: #ff7b72;">01:20</span></div>
                <div class="meta-data">Ставка: <span class="stake">150 ★</span></div>
            </div>
            <button class="btn-battle" disabled>В бой</button>
        </div>

        <div class="duel-card">
            <div class="duel-info">
                <div class="nickname">@shadow_user</div>
                <div class="meta-data">Время: <span style="color: #ff7b72;">04:55</span></div>
                <div class="meta-data">Ставка: <span class="stake">50 ★</span></div>
            </div>
            <button class="btn-battle" disabled>В бой</button>
        </div>
    </div>
</div>

</body>
</html>
