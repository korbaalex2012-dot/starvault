<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, minimum-scale=1.0">
  <title>StarVault - Ultimate PVP</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #090a0f;
      --card-bg: rgba(18, 22, 36, 0.75);
      --accent-cyan: #00f0ff;
      --accent-purple: #7000ff;
      --accent-pink: #ff007f;
      --accent-gold: #ffb700;
      --text-main: #f0f4f8;
      --text-sub: #7a889b;
      --glass-border: rgba(255, 255, 255, 0.08);
      --font-main: 'Outfit', sans-serif;
      --font-mono: 'Share Tech Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(112, 0, 255, 0.15), transparent 70%),
        radial-gradient(circle at 0% 100%, rgba(0, 240, 255, 0.1), transparent 50%);
      color: var(--text-main);
      font-family: var(--font-main);
      min-height: 100vh;
      padding-bottom: 80px;
    }

    header {
      position: sticky; top: 0; z-index: 100;
      backdrop-filter: blur(12px);
      background: rgba(9, 10, 15, 0.85);
      border-bottom: 1px solid var(--glass-border);
      padding: 12px 16px;
      display: flex; justify-content: space-between; align-items: center;
    }

    .user-badge { display: flex; align-items: center; gap: 10px; }
    .avatar {
      width: 40px; height: 40px; border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 18px;
    }

    .balance-pill {
      background: rgba(255, 183, 0, 0.1); border: 1px solid rgba(255, 183, 0, 0.3);
      padding: 6px 14px; border-radius: 20px; display: flex; align-items: center;
      gap: 6px; font-weight: 800; color: var(--accent-gold); font-size: 15px;
    }

    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0; height: 65px;
      background: rgba(12, 15, 23, 0.92); backdrop-filter: blur(16px);
      border-top: 1px solid var(--glass-border);
      display: flex; justify-content: space-around; align-items: center; z-index: 1000;
    }

    .nav-item {
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      color: var(--text-sub); font-size: 10px; font-weight: 600; cursor: pointer; width: 20%;
    }

    .nav-item.active { color: var(--accent-cyan); }

    .tab-page { display: none; padding: 16px; max-width: 500px; margin: 0 auto; }
    .tab-page.active { display: block; }

    .section-title { font-size: 18px; font-weight: 900; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; }

    .safes-grid, .items-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .items-grid { grid-template-columns: repeat(3, 1fr); }

    .safe-card, .item-card, .pvp-card {
      background: var(--card-bg); border: 1px solid var(--glass-border);
      border-radius: 16px; padding: 12px; display: flex; flex-direction: column;
      align-items: center; text-align: center; position: relative;
    }

    .safe-img, .item-img { width: 80px; height: 80px; object-fit: contain; margin: 8px 0; }
    .item-img { width: 55px; height: 55px; }

    .btn-hack {
      width: 100%; padding: 8px 0; border: none; border-radius: 10px;
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-cyan));
      color: #fff; font-weight: 800; font-size: 12px; cursor: pointer; margin-top: 6px;
    }

    .pvp-card { margin-bottom: 12px; align-items: stretch; text-align: left; }
    .pvp-header { display: flex; justify-content: space-between; align-items: center; }

    .game-overlay {
      position: fixed; inset: 0; background: rgba(6, 8, 12, 0.95);
      backdrop-filter: blur(20px); z-index: 2000; display: none;
      flex-direction: column; justify-content: space-between; padding: 20px 16px;
    }
    .game-overlay.active { display: flex; }

    .digits-container { display: flex; justify-content: center; gap: 8px; margin: 20px 0; }
    .digit-box {
      width: 45px; height: 55px; background: rgba(18, 22, 36, 0.9);
      border: 2px solid var(--glass-border); border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-mono); font-size: 24px; font-weight: bold; color: var(--accent-cyan);
    }

    .numpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 300px; margin: 0 auto; }
    .num-btn { background: var(--card-bg); border: 1px solid var(--glass-border); padding: 14px; border-radius: 10px; font-size: 18px; font-weight: 800; text-align: center; }

    .leader-row {
      background: var(--card-bg); border: 1px solid var(--glass-border);
      border-radius: 14px; padding: 12px; margin-bottom: 8px; display: flex;
      align-items: center; justify-content: space-between;
    }
  </style>
</head>
<body>

  <header>
    <div class="user-badge">
      <div class="avatar" id="uAvatar">U</div>
      <div>
        <div style="font-weight:700; font-size:14px" id="uName">Игрок</div>
        <div style="font-size:10px; color:var(--accent-cyan)" id="uPlaytime">В игре: 0 мин</div>
      </div>
    </div>
    <div class="balance-pill">
      <span>🪙</span>
      <span id="uBalance">500</span>
    </div>
  </header>

  <main class="tab-page active" id="page-safes">
    <div class="section-title"><span>Взлом Сейфов</span></div>
    <div class="safes-grid" id="safesContainer"></div>
  </main>

  <main class="tab-page" id="page-pvp">
    <div class="section-title"><span>PVP Дуэли</span> <button class="btn-hack" style="width:auto; padding:4px 12px" onclick="createPvpMatch()">+ Создать</button></div>
    <div id="pvpList"></div>
  </main>

  <main class="tab-page" id="page-inventory">
    <div class="section-title"><span>Инвентарь</span><span id="collCount" style="color:var(--accent-gold)">0/9</span></div>
    <div style="background:rgba(255,255,255,0.05); padding:10px; border-radius:12px; margin-bottom:12px; display:flex; justify-content:space-between; align-items:center;">
      <div>
        <div style="font-size:11px; color:var(--text-sub)">Пассивный доход</div>
        <div style="font-size:15px; font-weight:800; color:#00ff66" id="passiveIncome">+0 🪙/ч</div>
      </div>
      <button class="btn-hack" style="width:auto; padding:6px 14px" onclick="claimMining()">Собрать</button>
    </div>
    <div class="items-grid" id="inventoryGrid"></div>
  </main>

  <main class="tab-page" id="page-market">
    <div class="section-title"><span>P2P Маркет</span></div>
    <div id="marketList"></div>
  </main>

  <main class="tab-page" id="page-leaders">
    <div class="section-title"><span>Зал Славы</span></div>
    <div id="leaderList"></div>
  </main>

  <div class="game-overlay" id="gameModal">
    <div style="display:flex; justify-content:space-between;">
      <div>
        <h3 id="gSafeName">Сейф</h3>
        <p id="gSafeMode" style="font-size:12px; color:var(--text-sub)"></p>
      </div>
      <div id="gTimer" style="font-family:var(--font-mono); font-size:20px; color:var(--accent-pink); font-weight:bold;"></div>
    </div>

    <div>
      <div class="digits-container" id="digitsRow"></div>
      <p id="gameHint" style="text-align:center; font-size:12px; color:var(--accent-cyan); min-height:18px;"></p>
    </div>

    <div class="numpad">
      <div class="num-btn" onclick="pressKey(1)">1</div><div class="num-btn" onclick="pressKey(2)">2</div><div class="num-btn" onclick="pressKey(3)">3</div>
      <div class="num-btn" onclick="pressKey(4)">4</div><div class="num-btn" onclick="pressKey(5)">5</div><div class="num-btn" onclick="pressKey(6)">6</div>
      <div class="num-btn" onclick="pressKey(7)">7</div><div class="num-btn" onclick="pressKey(8)">8</div><div class="num-btn" onclick="pressKey(9)">9</div>
      <div class="num-btn" style="color:var(--accent-pink)" onclick="clearKey()">C</div>
      <div class="num-btn" onclick="pressKey(0)">0</div>
      <div class="num-btn" style="color:#00ff66" onclick="submitCode()">OK</div>
    </div>

    <button class="btn-hack" style="background:rgba(255,255,255,0.1)" onclick="closeGame()">Выход</button>
  </div>

  <nav class="bottom-nav">
    <div class="nav-item active" onclick="switchTab('safes', this)"><span>🔒</span><span>Сейфы</span></div>
    <div class="nav-item" onclick="switchTab('pvp', this)"><span>⚔️</span><span>PVP</span></div>
    <div class="nav-item" onclick="switchTab('inventory', this)"><span>🎒</span><span>Багаж</span></div>
    <div class="nav-item" onclick="switchTab('market', this)"><span>🏪</span><span>Рынок</span></div>
    <div class="nav-item" onclick="switchTab('leaders', this)"><span>🏆</span><span>Топ</span></div>
  </nav>
    <script>
    // TELEGRAM INIT
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) {
      tg.expand();
      if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
        document.getElementById('uName').innerText = tg.initDataUnsafe.user.username || tg.initDataUnsafe.user.first_name;
        document.getElementById('uAvatar').innerText = (tg.initDataUnsafe.user.first_name || 'U')[0].toUpperCase();
      }
    }

    // СПИСОК УРОВНЕЙ И ИГРОВЫХ БОКСОВ
    const VAULTS = [
      { id: 1, name: "🪵 Сундук", img: "IMG_20260719_180634.png", mode: "logic", cost: 20, len: 3, attempts: 8, reward: 50, dropId: 1, dropRate: 0.35 },
      { id: 2, name: "🟤 Чугунный", img: "IMG_20260719_181100.png", mode: "logic", cost: 50, len: 3, attempts: 8, reward: 120, dropId: 2, dropRate: 0.30 },
      { id: 3, name: "🥉 Медный", img: "IMG_20260719_181706.png", mode: "time", cost: 80, len: 4, time: 45, reward: 200, dropId: 3, dropRate: 0.25 },
      { id: 4, name: "⚙️ Штурвал", img: "IMG_20260719_183142.png", mode: "logic", cost: 120, len: 4, attempts: 8, reward: 300, dropId: 4, dropRate: 0.20 },
      { id: 5, name: "🗝️ Тёмный", img: "IMG_20260719_183244.png", mode: "time", cost: 200, len: 4, time: 40, reward: 500, dropId: 5, dropRate: 0.15 },
      { id: 6, name: "🥈 Серебряный", img: "IMG_20260719_183338.png", mode: "logic", cost: 350, len: 5, attempts: 10, reward: 900, dropId: 6, dropRate: 0.12 },
      { id: 7, name: "🥇 Золотой", img: "IMG_20260719_183351.png", mode: "time", cost: 500, len: 5, time: 35, reward: 1400, dropId: 7, dropRate: 0.10 },
      { id: 8, name: "🔘 Сканер", img: "IMG_20260719_183406.png", mode: "time", cost: 800, len: 5, time: 30, reward: 2200, dropId: 8, dropRate: 0.08 },
      { id: 9, name: "💎 Куб", img: "IMG_20260719_183425.png", mode: "time", cost: 1200, len: 5, time: 25, reward: 3500, dropId: 9, dropRate: 0.05 }
    ];

    // УСКОРЕННЫЕ ПРЕДМЕТЫ КОЛЛЕКЦИИ
    const ITEMS = [
      { id: 1, name: "Стетоскоп", img: "IMG_20260720_115622.png", income: 10 },
      { id: 2, name: "Отмычка", img: "IMG_20260720_115636.png", income: 25 },
      { id: 3, name: "Резак", img: "IMG_20260720_115645.png", income: 50 },
      { id: 4, name: "Майнер-Слиток", img: "IMG_20260720_115658.png", income: 100 },
      { id: 5, name: "Чип 'Призрак'", img: "IMG_20260720_115724.png", income: 200 },
      { id: 6, name: "Перчатка", img: "IMG_20260720_115747.png", income: 400 },
      { id: 7, name: "Дешифратор", img: "IMG_20260720_115800.png", income: 750 },
      { id: 8, name: "Тюнер", img: "IMG_20260720_115813.png", income: 1200 },
      { id: 9, name: "Мастер-Карта", img: "IMG_20260720_115823.png", income: 2500 }
    ];

    // СОСТОЯНИЕ (ПУСТОЙ ИНВЕНТАРЬ НА СТАРТЕ)
    let state = JSON.parse(localStorage.getItem('starvault_state')) || {
      coins: 500,
      inventory: [],
      playTimeSeconds: 0,
      lastMiningTime: Date.now()
    };

    function saveState() {
      localStorage.setItem('starvault_state', JSON.stringify(state));
      document.getElementById('uBalance').innerText = state.coins.toLocaleString();
    }

    // ТАЙМЕР ВРЕМЕНИ В ИГРЕ
    setInterval(() => {
      state.playTimeSeconds = (state.playTimeSeconds || 0) + 1;
      const mins = Math.floor(state.playTimeSeconds / 60);
      const hours = Math.floor(mins / 60);
      let timeStr = `${mins} мин`;
      if (hours > 0) timeStr = `${hours} ч ${mins % 60} мин`;
      document.getElementById('uPlaytime').innerText = `В игре: ${timeStr}`;
      
      if (state.playTimeSeconds % 10 === 0) saveState();
    }, 1000);
          // ТЕКУЩАЯ СЕССИЯ
    let activeBox = null;
    let targetCode = "";
    let currentInput = "";
    let gameTimer = null;
    let secondsLeft = 0;
    let attemptsLeft = 0;
    let isPvpGame = false;
    let pvpBet = 0;

    // СМЕНА ВКЛАДОК
    function switchTab(tabId, el) {
      document.querySelectorAll('.tab-page').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      document.getElementById(`page-${tabId}`).classList.add('active');
      el.classList.add('active');

      if (tabId === 'inventory') renderInventory();
      if (tabId === 'market') renderMarket();
      if (tabId === 'leaders') renderLeaders();
      if (tabId === 'pvp') renderPvp();
    }

    // РЕНДЕР СЕЙФОВ
    function renderSafes() {
      const container = document.getElementById('safesContainer');
      container.innerHTML = VAULTS.map(s => `
        <div class="safe-card">
          <div style="font-weight:800; font-size:13px">${s.name}</div>
          <img src="${s.img}" class="safe-img" alt="${s.name}">
          <div style="font-size:11px; color:var(--text-sub)">Вход: ${s.cost} 🪙</div>
          <div style="font-size:11px; color:var(--accent-gold); font-weight:700">Приз: +${s.reward} 🪙</div>
          <button class="btn-hack" onclick="startBoxGame(${s.id})">ОТКРЫТЬ</button>
        </div>
      `).join('');
    }

    // ЗАПУСК ИГРЫ СЕЙФА
    function startBoxGame(boxId) {
      isPvpGame = false;
      activeBox = VAULTS.find(s => s.id === boxId);

      if (state.coins < activeBox.cost) {
        alert(`❌ Нужно ${activeBox.cost} 🪙 для входа!`);
        return;
      }

      state.coins -= activeBox.cost;
      saveState();

      targetCode = "";
      for (let i = 0; i < activeBox.len; i++) {
        targetCode += Math.floor(Math.random() * 10).toString();
      }
      currentInput = "";

      document.getElementById('gSafeName').innerText = activeBox.name;
      document.getElementById('gameHint').innerText = "";
      document.getElementById('gameModal').classList.add('active');

      if (activeBox.mode === 'logic') {
        attemptsLeft = activeBox.attempts;
        document.getElementById('gSafeMode').innerText = `Попыток: ${attemptsLeft}`;
        document.getElementById('gTimer').innerText = `🧠 x${attemptsLeft}`;
      } else {
        secondsLeft = activeBox.time;
        document.getElementById('gSafeMode').innerText = `Время: ${activeBox.time} с`;
        document.getElementById('gTimer').innerText = `00:${secondsLeft < 10 ? '0' : ''}${secondsLeft}`;

        gameTimer = setInterval(() => {
          secondsLeft--;
          document.getElementById('gTimer').innerText = `00:${secondsLeft < 10 ? '0' : ''}${secondsLeft}`;
          if (secondsLeft <= 0) {
            clearInterval(gameTimer);
            alert("⏰ Время вышло!");
            closeGame();
          }
        }, 1000);
      }

      updateDigitsDisplay();
    }

    function pressKey(num) {
      if (currentInput.length < activeBox.len) {
        currentInput += num.toString();
        updateDigitsDisplay();
      }
    }

    function clearKey() {
      currentInput = "";
      updateDigitsDisplay();
    }

    function updateDigitsDisplay() {
      const container = document.getElementById('digitsRow');
      container.innerHTML = "";
      for (let i = 0; i < activeBox.len; i++) {
        const char = currentInput[i] || "_";
        container.innerHTML += `<div class="digit-box">${char}</div>`;
      }
    }

    function submitCode() {
      if (currentInput.length < activeBox.len) return;

      if (currentInput === targetCode) {
        if (gameTimer) clearInterval(gameTimer);

        if (isPvpGame) {
          // Выигрыш в PVP за вычетом 10% комиссии
          const winAmount = Math.floor(pvpBet * 2 * 0.9);
          state.coins += winAmount;
          saveState();
          alert(`⚔️ ПОБЕДА В ДУЭЛИ!\nЗаработано с учётом 10% комиссии: +${winAmount} 🪙`);
        } else {
          state.coins += activeBox.reward;

          let droppedMsg = "";
          if (Math.random() <= activeBox.dropRate) {
            const invItem = state.inventory.find(i => i.id === activeBox.dropId);
            if (invItem) {
              invItem.count += 1;
            } else {
              state.inventory.push({ id: activeBox.dropId, count: 1 });
            }
            const droppedItem = ITEMS.find(i => i.id === activeBox.dropId);
            droppedMsg = `\n\n🎁 Находка: ${droppedItem.name}!`;
          }

          saveState();
          alert(`🎉 УСПЕХ!\nНаграда: +${activeBox.reward} 🪙${droppedMsg}`);
        }
        closeGame();
      } else {
        let correctDigits = 0;
        for (let i = 0; i < activeBox.len; i++) {
          if (currentInput[i] === targetCode[i]) correctDigits++;
        }

        if (activeBox.mode === 'logic') {
          attemptsLeft--;
          document.getElementById('gSafeMode').innerText = `Попыток: ${attemptsLeft}`;
          document.getElementById('gTimer').innerText = `🧠 x${attemptsLeft}`;

          if (attemptsLeft <= 0) {
            alert("❌ Попытки закончились!");
            closeGame();
            return;
          }
        }

        document.getElementById('gameHint').innerText = `❌ Совпадений мест: ${correctDigits}`;
      }
    }

    function closeGame() {
      if (gameTimer) clearInterval(gameTimer);
      document.getElementById('gameModal').classList.remove('active');
    }

    // ИНВЕНТАРЬ И СТАКИ (x2, x3)
    function renderInventory() {
      const grid = document.getElementById('inventoryGrid');
      document.getElementById('collCount').innerText = `${state.inventory.length} / 9`;

      let totalIncome = 0;
      grid.innerHTML = ITEMS.map(item => {
        const invItem = state.inventory.find(i => i.id === item.id);
        const count = invItem ? invItem.count : 0;
        const owned = count > 0;

        if (owned) totalIncome += item.income * count;

        return `
          <div class="item-card ${owned ? '' : 'locked'}" style="${owned ? '' : 'opacity:0.35'}">
            <img src="${item.img}" class="item-img">
            <div style="font-size:10px; font-weight:700">${item.name} ${count > 1 ? `<span style="color:var(--accent-gold)">x${count}</span>` : ''}</div>
            <div style="font-size:9px; color:#00ff66; margin-top:2px">+${item.income * (count || 1)}🪙/ч</div>
            ${owned ? `<button class="btn-hack" style="padding:2px 0; font-size:9px; background:var(--accent-pink)" onclick="tradeItem(${item.id})">Продать 1шт</button>` : ''}
          </div>
        `;
      }).join('');

      document.getElementById('passiveIncome').innerText = `+${totalIncome} 🪙/час`;
    }

    // МАРКЕТ С 10% КОМИССИЕЙ
    function tradeItem(itemId) {
      const item = ITEMS.find(i => i.id === itemId);
      const invIndex = state.inventory.findIndex(i => i.id === itemId);
      if (invIndex === -1) return;

      const priceStr = prompt(`Выставить 1 шт. "${item.name}" на Маркет.\nЦена в монетах:`, "500");
      if (!priceStr) return;

      const price = parseInt(priceStr);
      if (isNaN(price) || price <= 0) {
        alert("❌ Неверная цена!");
        return;
      }

      if (state.inventory[invIndex].count > 1) {
        state.inventory[invIndex].count -= 1;
      } else {
        state.inventory.splice(invIndex, 1);
      }

      let marketItems = JSON.parse(localStorage.getItem('starvault_market')) || [];
      marketItems.push({
        id: Date.now(),
        itemId: item.id,
        seller: document.getElementById('uName').innerText,
        price: price
      });
      localStorage.setItem('starvault_market', JSON.stringify(marketItems));

      saveState();
      renderInventory();
      alert(`✅ 1 шт. "${item.name}" выставлена на Маркет за ${price} 🪙!`);
    }

    function renderMarket() {
      const list = document.getElementById('marketList');
      let marketItems = JSON.parse(localStorage.getItem('starvault_market')) || [];

      if (marketItems.length === 0) {
        list.innerHTML = `<p style="text-align:center; color:var(--text-sub); margin-top:20px">На рынке нет лотов.</p>`;
        return;
      }

      list.innerHTML = marketItems.map(lot => {
        const item = ITEMS.find(i => i.id === lot.itemId);
        const isMyLot = lot.seller === document.getElementById('uName').innerText;

        return `
          <div class="leader-row">
            <div style="display:flex; align-items:center; gap:10px">
              <img src="${item.img}" style="width:35px; height:35px; object-fit:contain">
              <div>
                <div style="font-weight:800; font-size:13px">${item.name}</div>
                <div style="font-size:10px; color:var(--text-sub)">@${lot.seller}</div>
              </div>
            </div>
            ${isMyLot 
              ? `<span style="font-size:11px; color:var(--accent-gold)">Мой лот (${lot.price} 🪙)</span>`
              : `<button class="btn-hack" style="width:auto; padding:4px 10px" onclick="buyMarketItem(${lot.id})">${lot.price} 🪙</button>`
            }
          </div>
        `;
      }).join('');
    }

    function buyMarketItem(lotId) {
      let marketItems = JSON.parse(localStorage.getItem('starvault_market')) || [];
      const lotIndex = marketItems.findIndex(l => l.id === lotId);
      if (lotIndex === -1) return;

      const lot = marketItems[lotIndex];
      if (state.coins < lot.price) {
        alert("❌ Недостаточно монет!");
        return;
      }

      state.coins -= lot.price;
      const invItem = state.inventory.find(i => i.id === lot.itemId);
      if (invItem) {
        invItem.count += 1;
      } else {
        state.inventory.push({ id: lot.itemId, count: 1 });
      }

      marketItems.splice(lotIndex, 1);
      localStorage.setItem('starvault_market', JSON.stringify(marketItems));

      saveState();
      renderMarket();
      alert("🎉 Покупка совершена!");
    }

    // КОНСТРУКТОР PVP ДУЭЛЕЙ
    function createPvpMatch() {
      const code = prompt("Придумайте секретный код (3-5 цифр):", "1234");
      if (!code || isNaN(parseInt(code))) {
        alert("❌ Некорректный код!");
        return;
      }

      const mode = confirm("ОК — На Попытки | Отмена — На Время") ? "logic" : "time";
      const limitStr = prompt(mode === "logic" ? "Укажите количество попыток:" : "Укажите время в секундах:", "5");
      const limit = parseInt(limitStr);

      const betStr = prompt("Укажите ставку в монетах:", "200");
      const bet = parseInt(betStr);

      if (isNaN(bet) || bet <= 0 || bet > state.coins) {
        alert("❌ Недостаточно монет или неверная ставка!");
        return;
      }

      state.coins -= bet;
      saveState();

      let pvpMatches = JSON.parse(localStorage.getItem('starvault_pvp')) || [];
      pvpMatches.push({
        id: Date.now(),
        host: document.getElementById('uName').innerText,
        code: code,
        mode: mode,
        limit: limit,
        bet: bet
      });
      localStorage.setItem('starvault_pvp', JSON.stringify(pvpMatches));

      renderPvp();
      alert("⚔️ Дуэль создана!");
    }

    function renderPvp() {
      const list = document.getElementById('pvpList');
      let pvpMatches = JSON.parse(localStorage.getItem('starvault_pvp')) || [];
      const myName = document.getElementById('uName').innerText;

      if (pvpMatches.length === 0) {
        list.innerHTML = `<p style="text-align:center; color:var(--text-sub); margin-top:20px">Нет активных дуэлей.</p>`;
        return;
      }

      list.innerHTML = pvpMatches.map(m => {
        const isMyMatch = m.host === myName;
        const winAmount = Math.floor(m.bet * 2 * 0.9);
        return `
          <div class="pvp-card">
            <div class="pvp-header">
              <div>
                <div style="font-weight:800; font-size:14px">Дуэль от @${m.host}</div>
                <div style="font-size:11px; color:var(--accent-gold)">Куш: ${winAmount} 🪙 (Ставка: ${m.bet})</div>
                <div style="font-size:10px; color:var(--text-sub)">Режим: ${m.mode === 'logic' ? `${m.limit} попыток` : `${m.limit} сек`}</div>
              </div>
              ${isMyMatch 
                ? `<span style="font-size:11px; color:var(--accent-pink)">Ваш вызов</span>`
                : `<button class="btn-hack" style="width:auto; padding:6px 12px" onclick="acceptPvp(${m.id})">Принять</button>`
              }
            </div>
          </div>
        `;
      }).join('');
    }

    function acceptPvp(matchId) {
      let pvpMatches = JSON.parse(localStorage.getItem('starvault_pvp')) || [];
      const match = pvpMatches.find(m => m.id === matchId);
      if (!match) return;

      if (state.coins < match.bet) {
        alert("❌ Недостаточно монет!");
        return;
      }

      const playAsHacker = confirm("Нажмите 'ОК', чтобы отгадывать самому.\nНажмите 'Отмена', чтобы быть наблюдателем.");

      state.coins -= match.bet;
      saveState();

      pvpMatches = pvpMatches.filter(m => m.id !== matchId);
      localStorage.setItem('starvault_pvp', JSON.stringify(pvpMatches));

      if (playAsHacker) {
        isPvpGame = true;
        pvpBet = match.bet;
        targetCode = match.code;
        currentInput = "";

        activeBox = {
          name: "⚔️ PVP Дуэль",
          mode: match.mode,
          len: match.code.length,
          attempts: match.limit,
          time: match.limit
        };

        document.getElementById('gSafeName').innerText = "⚔️ PVP Дуэль";
        document.getElementById('gameHint').innerText = "";
        document.getElementById('gameModal').classList.add('active');

        if (match.mode === 'logic') {
          attemptsLeft = match.limit;
          document.getElementById('gSafeMode').innerText = `Попыток: ${attemptsLeft}`;
          document.getElementById('gTimer').innerText = `🧠 x${attemptsLeft}`;
        } else {
          secondsLeft = match.limit;
          document.getElementById('gSafeMode').innerText = `Время: ${secondsLeft}с`;
          gameTimer = setInterval(() => {
            secondsLeft--;
            document.getElementById('gTimer').innerText = `00:${secondsLeft < 10 ? '0' : ''}${secondsLeft}`;
            if (secondsLeft <= 0) {
              clearInterval(gameTimer);
              alert("⏰ Время вышло!");
              closeGame();
            }
          }, 1000);
        }
        updateDigitsDisplay();
      } else {
        alert(`👁️ Вы наблюдатель. Код дуэли был: ${match.code}`);
        renderPvp();
      }
    }

    // ЛИДЕРБОРД
    function renderLeaders() {
      const list = document.getElementById('leaderList');
      const myName = document.getElementById('uName').innerText;

      const mins = Math.floor((state.playTimeSeconds || 0) / 60);
      const hours = Math.floor(mins / 60);
      let timeStr = `${mins}м`;
      if (hours > 0) timeStr = `${hours}ч ${mins % 60}м`;

      let leaders = [
        { name: myName, coins: state.coins, timeStr: timeStr, isMe: true }
      ];

      list.innerHTML = leaders.map((player, idx) => `
        <div class="leader-row" style="${player.isMe ? 'border-color: var(--accent-cyan);' : ''}">
          <div style="display:flex; align-items:center; gap:10px">
            <span style="font-weight:900; color:var(--accent-gold)">#${idx + 1}</span>
            <div>
              <div style="font-weight:800; font-size:13px">@${player.name} ${player.isMe ? '(Вы)' : ''}</div>
              <div style="font-size:10px; color:var(--accent-cyan)">⏱️ В игре: ${player.timeStr}</div>
            </div>
          </div>
          <div style="font-weight:900; color:var(--accent-gold)">${player.coins.toLocaleString()} 🪙</div>
        </div>
      `).join('');
    }

    function claimMining() {
      const now = Date.now();
      const hoursPassed = (now - state.lastMiningTime) / (1000 * 60 * 60);

      let totalRate = 0;
      state.inventory.forEach(inv => {
        const it = ITEMS.find(i => i.id === inv.id);
        if (it) totalRate += it.income * inv.count;
      });

      const earned = Math.floor(hoursPassed * totalRate);
      if (earned > 0) {
        state.coins += earned;
        state.lastMiningTime = now;
        saveState();
        alert(`💰 Собрано: +${earned} 🪙`);
      } else {
        alert("⏱️ Награда пока накапливается!");
      }
    }

    saveState();
    renderSafes();
  </script>
</body>
</html>
