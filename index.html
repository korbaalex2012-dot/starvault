<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StarVault Premium</title>
    <script src="https://telegram.org"></script>
    <style>
        body { background: radial-gradient(circle at center, #111827, #030712); color: #f8fafc; font-family: 'Segoe UI', Roboto, sans-serif; text-align: center; margin: 0; padding: 15px; user-select: none; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .game-container { width: 100%; max-width: 360px; background: linear-gradient(180deg, rgba(30, 41, 59, 0.6) 0%, rgba(15, 23, 42, 0.8) 100%); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); padding: 25px 15px; border-radius: 28px; box-shadow: 0 25px 60px rgba(0,0,0,0.8); }
        .main-jackpot-title { font-size: 11px; color: #fbbf24; text-transform: uppercase; letter-spacing: 2px; font-weight: 800; margin-bottom: 2px; }
        .jackpot-display { font-size: 38px; font-weight: 900; color: #fbbf24; text-shadow: 0 0 20px rgba(251, 191, 36, 0.6); margin-bottom: 5px; font-family: 'Impact', sans-serif; letter-spacing: 1px; }
        .sub-title { font-size: 11px; color: #94a3b8; margin-bottom: 20px; font-weight: 600; }
        .tabs { display: flex; justify-content: center; gap: 6px; margin-bottom: 20px; width: 100%; }
        .tab { background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255,255,255,0.06); color: #94a3b8; padding: 10px 2px; border-radius: 12px; cursor: pointer; flex: 1; font-size: 9px; font-weight: 800; text-transform: uppercase; transition: all 0.3s ease; }
        .tab.active { background: linear-gradient(135deg, #fbbf24, #d97706); border-color: #fbbf24; color: #000; box-shadow: 0 0 15px rgba(251, 191, 36, 0.4); }
        .vault-door { background: radial-gradient(circle at center, #334155, #0f172a); border: 8px solid #1e293b; box-shadow: 0 15px 35px rgba(0,0,0,0.6), inset 0 4px 10px rgba(255,255,255,0.2); border-radius: 50%; width: 240px; height: 240px; margin: 15px auto; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; border-style: double; outline: 3px solid rgba(255,255,255,0.05); }
        .display-gold { background: linear-gradient(180deg, #1e293b 0%, #020617 100%); border: 3px solid #fbbf24; box-shadow: 0 0 15px rgba(251, 191, 36, 0.3), inset 0 2px 8px rgba(0,0,0,0.8); border-radius: 14px; padding: 12px 8px; display: flex; gap: 8px; margin-bottom: 5px; }
        .digit-box { display: flex; flex-direction: column; align-items: center; }
        .arrow-btn { background: none; border: none; color: #fbbf24; font-size: 16px; cursor: pointer; padding: 2px 10px; font-weight: 900; transition: transform 0.1s; text-shadow: 0 0 5px rgba(251, 191, 36, 0.5); }
        .arrow-btn:active { transform: scale(1.3); }
        .display-num { font-size: 36px; font-weight: 900; font-family: monospace; color: #fbbf24; text-shadow: 0 0 12px rgba(251, 191, 36, 0.7); width: 34px; height: 44px; display: flex; align-items: center; justify-content: center; }
        .btn-lock { background: linear-gradient(135deg, #10b981, #047857); border: 1px solid rgba(255,255,255,0.1); color: #fff; padding: 15px; font-size: 14px; font-weight: 800; border-radius: 14px; cursor: pointer; width: 100%; text-transform: uppercase; letter-spacing: 1px; margin-top: 15px; box-shadow: 0 6px 20px rgba(16,185,129,0.3); transition: all 0.2s; }
        .btn-lock:active { transform: scale(0.98); }
        .hint-text { color: #94a3b8; font-size: 12px; margin-top: 15px; min-height: 40px; padding: 8px; background: rgba(15, 23, 42, 0.5); border-radius: 10px; border: 1px solid rgba(255,255,255,0.03); display: flex; align-items: center; justify-content: center; font-weight: 500; line-height: 1.4; }
        .coins-badge { font-size: 13px; color: #38bdf8; font-weight: 700; margin-bottom: 10px; text-shadow: 0 0 8px rgba(56,189,248,0.4); display: none; }
        .promo-container { display: none; gap: 6px; margin-top: 12px; width: 100%; justify-content: center; }
        .promo-in { background: #020617; border: 1px solid rgba(255,255,255,0.1); color: #fff; padding: 10px; border-radius: 8px; width: 60%; text-align: center; font-weight: 700; font-size: 13px; }
        .promo-go { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); color: #fff; padding: 10px 14px; border-radius: 8px; cursor: pointer; font-weight: 700; }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="main-jackpot-title">👑 Главный Джекпот 👑</div>
        <div class="jackpot-display"><span id="bank-counter">257 312</span> ★</div>
        <div class="sub-title">🔥 Каждая попытка = + звёзды в общий банк</div>
        
        <div class="coins-badge" id="coins-display">🪙 БАЛАНС: <span id="user-coins">100</span> МОНЕТ</div>

        <div class="tabs">
            <button class="tab active" onclick="changeSafe('bronze', 5)">Бронза<br>5 ★</button>
            <button class="tab" onclick="changeSafe('silver', 50)">Серебро<br>50 ★</button>
            <button class="tab" onclick="changeSafe('gold', 500)">Золото<br>500 ★</button>
            <button class="tab" onclick="changeSafe('friend', 0)">С другом<br>(Монеты)</button>
        </div>

        <div class="vault-door">
            <div style="font-size:9px; font-weight:800; color:#94a3b8; letter-spacing:1px; margin-bottom:8px;">УГАДАЙ КОД</div>
            <div class="display-gold">
                <div class="digit-box"><button class="arrow-btn" onclick="move(0,1)">▲</button><span class="display-num" id="d0">0</span><button class="arrow-btn" onclick="move(0,-1)">▼</button></div>
                <div class="digit-box"><button class="arrow-btn" onclick="move(1,1)">▲</button><span class="display-num" id="d1">0</span><button class="arrow-btn" onclick="move(1,-1)">▼</button></div>
                <div class="digit-box"><button class="arrow-btn" onclick="move(2,1)">▲</button><span class="display-num" id="d2">0</span><button class="arrow-btn" onclick="move(2,-1)">▼</button></div>
                <div class="digit-box"><button class="arrow-btn" onclick="move(3,1)">▲</button><span class="display-num" id="d3">0</span><button class="arrow-btn" onclick="move(3,-1)">▼</button></div>
            </div>
        </div>

        <button class="btn-lock" id="action-btn" onclick="checkCode()">Взломать за 5 ★</button>
        <div class="hint-text" id="hint">Сейф заперт. Крути стрелочки и подбирай 4-значный шифр!</div>

        <div class="promo-container" id="promo-area">
            <input type="text" class="promo-in" id="promo-field" placeholder="ПРОМОКОД">
            <button class="promo-go" onclick="activatePromo()">OK</button>
        </div>
    </div>

    <script>
        let vaultCodes = {
            bronze: Array.from({length: 4}, () => Math.floor(Math.random() * 10)),
            silver: Array.from({length: 4}, () => Math.floor(Math.random() * 10)),
            gold: Array.from({length: 4}, () => Math.floor(Math.random() * 10)),
            friend: Array.from({length: 4}, () => Math.floor(Math.random() * 10))
        };
        
        let currentCode =;
        let currentMode = 'bronze';
        let currentCost = 5;
        let coins = 100;

        function move(idx, dir) {
            currentCode[idx] = (currentCode[idx] + dir + 10) % 10;
            document.getElementById('d' + idx).innerText = currentCode[idx];
        }

        function changeSafe(type, cost) {
            currentMode = type;
            currentCost = cost;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            if(event) event.currentTarget.classList.add('active');
            
            let btn = document.getElementById('action-btn');
            let dispGold = document.querySelector('.display-gold');
            
            if(type === 'friend') {
                btn.innerText = `ИГРАТЬ (10 🪙)`;
                btn.style.background = 'linear-gradient(135deg, #0ea5e9, #0369a1)';
                btn.style.boxShadow = '0 6px 20px rgba(14,165,233,0.3)';
                dispGold.style.borderColor = '#0ea5e9';
                dispGold.style.boxShadow = '0 0 15px rgba(14,165,233,0.3)';
                document.getElementById('coins-display').style.display = 'block';
                document.getElementById('promo-area').style.display = 'flex';
                document.getElementById('hint').innerText = "Бесплатная тренировка запущена! Код обновлен.";
            } else {
                btn.innerText = `Взломать за ${cost} ★`;
                let mainColor = type === 'bronze' ? '#10b981' : (type === 'silver' ? '#f59e0b' : '#ef4444');
                let endColor = type === 'bronze' ? '#047857' : (type === 'silver' ? '#b45309' : '#b91c1c');
                btn.style.background = `linear-gradient(135deg, ${mainColor}, ${endColor})`;
                btn.style.boxShadow = `0 6px 20px ${mainColor}4d`;
                dispGold.style.borderColor = '#fbbf24';
                dispGold.style.boxShadow = '0 0 15px rgba(251, 191, 36, 0.3)';
                
                document.getElementById('coins-display').style.display = 'none';
                document.getElementById('promo-area').style.display = 'none';
                let fakeBank = type === 'bronze' ? 4250 : (type === 'silver' ? 45300 : 257312);
                document.getElementById('bank-counter').innerText = fakeBank.toLocaleString();
                document.getElementById('hint').innerText = "Шифр сейфа зафиксирован. Каждая попытка дает анализ совпадений!";
            }
        }

        function checkCode() {
            let targetCode = vaultCodes[currentMode];
            
            if(currentMode === 'friend') {
                if(coins < 10) {
                    document.getElementById('hint').innerText = "❌ Не хватает монет! Введи промокод STAR.";return;}coins -= 10;document.getElementById('user-coins').innerText = coins;}let correctDigits = 0;let correctPositions = 0;for(let i=0; i<4; i++) {if(currentCode[i] === targetCode[i]) correctPositions++;if(targetCode.includes(currentCode[i])) correctDigits++;}let hintElement = document.getElementById('hint');if(correctPositions === 4) {if(currentMode === 'friend') {coins += 100;document.getElementById('user-coins').innerText = coins;hintElement.innerHTML = "💥 ВЗЛОМАНО! +100 монет в карман!";} else {hintElement.innerHTML = "💥 СЕЙФ ВЗОРВАН! ДЖЕКПОТ ВАШ!";alert("БАНК ВЗЛОМАН! Джекпот!");}vaultCodes[currentMode] = Array.from({length: 4}, () => Math.floor(Math.random() * 10));} else {hintElement.innerHTML = ⚙️ <b>Анализ:</b> совпало цифр: <span style='color:#fff'>${correctDigits}</span> | на своих местах: <span style='color:#fbbf24'>${correctPositions}</span>;}}function activatePromo() {let input = document.getElementById('promo-field').value.trim().toUpperCase();if(input === 'STAR' || input === 'BONUS') {coins += 50;document.getElementById('user-coins').innerText = coins;document.getElementById('hint').innerText = "✅ Получено +50 монет!";document.getElementById('promo-field').value = "";} else {document.getElementById('hint').innerText = "❌ Код не найден!";}}
