<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Главное Меню — Сейфы</title>
    <style>
        :root {
            --bg-color: #0b0f17;
            --panel-bg: rgba(22, 27, 34, 0.8);
            --gold-accent: #e3b341;
            --blue-neon: #00f0ff;
            --text-color: #c9d1d9;
            --btn-bg: #1f2631;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Контейнер всего экрана смартфона */
        .menu-container {
            width: 100%;
            max-width: 400px;
            height: 750px;
            background: radial-gradient(circle at center, #161f30 0%, #0b0f17 100%);
            border: 2px solid #21262d;
            border-radius: 24px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 12px 40px rgba(0,0,0,0.7);
            overflow: hidden;
        }

        /* Верхняя панель с круглыми кнопками справа */
        .top-bar {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-bottom: 30px;
            z-index: 10;
        }

        .circle-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background-color: var(--btn-bg);
            border: 1.5px solid var(--gold-accent);
            color: #fff;
            font-size: 18px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(227, 179, 65, 0.2);
        }

        /* Центральная большая кнопка-сейф */
        .main-safe-button {
            flex: 1;
            max-height: 320px;
            background-color: #10141d;
            border: 2px solid var(--blue-neon);
            border-radius: 16px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding: 20px;
            cursor: pointer;
            position: relative;
            box-shadow: inset 0 0 20px rgba(0, 240, 255, 0.2), 0 0 15px rgba(0, 240, 255, 0.1);
            z-index: 5;
            /* Здесь будет твоя картинка сейфа, когда положишь её в проект */
            background-image: url('safe_bg.png'); 
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
        }

        .main-safe-button::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(to top, rgba(11,15,23,0.9) 10%, rgba(11,15,23,0) 60%);
            border-radius: 14px;
            z-index: 1;
        }

        .safe-btn-title {
            font-size: 22px;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 10px var(--blue-neon);
            letter-spacing: 2px;
            z-index: 2;
            text-transform: uppercase;
        }

        /* Средний ряд: Придумай сам и PVP */
        .middle-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .menu-btn {
            height: 90px;
            background-color: var(--btn-bg);
            border: 1.5px solid #30363d;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            cursor: pointer;
            text-transform: uppercase;
        }

        .btn-pvp {
            border-color: var(--gold-accent);
            box-shadow: 0 0 10px rgba(227, 179, 65, 0.1);
        }

        .btn-locked {
            color: #8b949e;
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Нижний ряд: Дейлик и Магазин */
        .bottom-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: auto; /* Прижимает к низу смартфона */
        }

        .bottom-btn {
            height: 80px;
            background-color: var(--btn-bg);
            border: 1.5px solid #30363d;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 5px;
            font-size: 14px;
            font-weight: bold;
            color: #fff;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="menu-container">
    
    <div class="top-bar">
        <div class="circle-btn" title="Настройки">⚙️</div>
        <div class="circle-btn" title="Лидеры">🏆</div>
        <div class="circle-btn" title="Языки">🌐</div>
    </div>

    <div class="main-safe-button">
        <div class="safe-btn-title">Взлом Системы</div>
    </div>

    <div class="middle-row">
        <div class="menu-btn btn-locked">[ Заблокировано ]</div>
        <div class="menu-btn btn-pvp">PVP Дуэли</div>
    </div>

    <div class="bottom-row">
        <div class="bottom-btn">
            <span style="font-size: 20px;">🎁</span>
            <span>Дейли</span>
        </div>
        <div class="bottom-btn">
            <span style="font-size: 20px;">🛒</span>
            <span>Магазин</span>
        </div>
    </div>

</div>

</body>
</html>
