<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, minimum-scale=1.0">
  <title>StarVault - Ultimate Hack Game</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #090a0f;
      --card-bg: rgba(18, 22, 36, 0.75);
      --border-glow: #1f293d;
      --accent-cyan: #00f0ff;
      --accent-purple: #7000ff;
      --accent-pink: #ff007f;
      --accent-gold: #ffb700;
      --text-main: #f0f4f8;
      --text-sub: #7a889b;
      --glass-border: rgba(255, 255, 255, 0.08);
      --font-main: 'Outfit', sans-serif;
      --font-mono: 'Share Tech Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(112, 0, 255, 0.15), transparent 70%),
        radial-gradient(circle at 0% 100%, rgba(0, 240, 255, 0.1), transparent 50%);
      color: var(--text-main);
      font-family: var(--font-main);
      min-height: 100vh;
      overflow-x: hidden;
      padding-bottom: 80px;
    }

    /* Header */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(12px);
      background: rgba(9, 10, 15, 0.85);
      border-bottom: 1px solid var(--glass-border);
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .user-badge {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 18px;
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
    }

    .user-info .username {
      font-weight: 700;
      font-size: 15px;
      line-height: 1.2;
    }

    .user-info .rank {
      font-size: 11px;
      color: var(--accent-cyan);
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .balance-pill {
      background: rgba(255, 183, 0, 0.1);
      border: 1px solid rgba(255, 183, 0, 0.3);
      padding: 6px 14px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 800;
      color: var(--accent-gold);
      font-size: 15px;
      box-shadow: 0 0 12px rgba(255, 183, 0, 0.15);
    }

    /* Bottom Nav */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 65px;
      background: rgba(12, 15, 23, 0.92);
      backdrop-filter: blur(16px);
      border-top: 1px solid var(--glass-border);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 1000;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      color: var(--text-sub);
      font-size: 10px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      width: 25%;
    }

    .nav-item .icon {
      font-size: 20px;
      transition: transform 0.2s;
    }

    .nav-item.active {
      color: var(--accent-cyan);
    }

    .nav-item.active .icon {
      transform: translateY(-2px) scale(1.15);
      text-shadow: 0 0 10px var(--accent-cyan);
    }

    /* Page Wrappers */
    .tab-page {
      display: none;
      padding: 16px;
      max-width: 500px;
      margin: 0 auto;
      animation: fadeIn 0.3s ease;
    }

    .tab-page.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .section-title {
      font-size: 20px;
      font-weight: 900;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      letter-spacing: -0.5px;
    }

    .section-title span {
      background: linear-gradient(90deg, #fff, var(--text-sub));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Safes Grid */
    .safes-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .safe-card {
      background: var(--card-bg);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      position: relative;
      overflow: hidden;
      transition: all 0.2s ease;
    }

    .safe-card:active {
      transform: scale(0.97);
    }

    .safe-mode-badge {
      position: absolute;
      top: 8px;
      left: 8px;
      font-size: 9px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 10px;
      text-transform: uppercase;
    }

    .safe-mode-badge.logic {
      background: rgba(0, 240, 255, 0.15);
      color: var(--accent-cyan);
      border: 1px solid rgba(0, 240, 255, 0.3);
    }

    .safe-mode-badge.time {
      background: rgba(255, 0, 127, 0.15);
      color: var(--accent-pink);
      border: 1px solid rgba(255, 0, 127, 0.3);
    }

    .safe-img {
      width: 100px;
      height: 100px;
      object-fit: contain;
      margin: 12px 0 8px 0;
      filter: drop-shadow(0 6px 12px rgba(0,0,0,0.5));
    }

    .safe-name {
      font-weight: 800;
      font-size: 14px;
      margin-bottom: 2px;
    }

    .safe-cost {
      font-size: 11px;
      color: var(--accent-pink);
      font-weight: 700;
      margin-bottom: 2px;
    }

    .safe-reward {
      font-size: 11px;
      color: var(--accent-gold);
      font-weight: 700;
      margin-bottom: 10px;
    }

    .btn-hack {
      width: 100%;
      padding: 8px 0;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-cyan));
      color: #fff;
      font-weight: 800;
      font-size: 12px;
      letter-spacing: 0.5px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(112, 0, 255, 0.3);
    }

    /* Modal Gameplay Overlay */
    .game-overlay {
      position: fixed;
      inset: 0;
      background: rgba(6, 8, 12, 0.95);
      backdrop-filter: blur(20px);
      z-index: 2000;
      display: none;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px 16px;
    }

    .game-overlay.active {
      display: flex;
    }

    .game-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .game-timer-box {
      font-family: var(--font-mono);
      font-size: 22px;
      font-weight: bold;
      color: var(--accent-pink);
      text-shadow: 0 0 10px var(--accent-pink);
    }

    .digits-container {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin: 25px 0 15px 0;
    }

    .digit-box {
      width: 50px;
      height: 65px;
      background: rgba(18, 22, 36, 0.9);
      border: 2px solid var(--glass-border);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-mono);
      font-size: 28px;
      font-weight: bold;
      color: var(--accent-cyan);
      box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
    }

    .numpad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      max-width: 320px;
      margin: 0 auto;
    }

    .num-btn {
      background: var(--card-bg);
      border: 1px solid var(--glass-border);
      padding: 16px;
      border-radius: 12px;
      font-size: 20px;
      font-weight: 800;
      color: #fff;
      text-align: center;
      cursor: pointer;
    }

    .num-btn:active {
      background: var(--accent-purple);
    }

    .collection-counter {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      padding: 12px;
      border-radius: 14px;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .items-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .item-card {
      background: var(--card-bg);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      position: relative;
    }

    .item-card.locked {
      opacity: 0.35;
      filter: grayscale(1);
    }

    .item-img {
      width: 65px;
      height: 65px;
      object-fit: contain;
      margin-bottom: 6px;
    }

    .item-title {
      font-size: 10px;
      font-weight: 700;
      line-height: 1.2;
    }

    .leader-row {
      background: var(--card-bg);
      border: 1px solid var(--glass-border);
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .leader-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .rank-num {
      font-weight: 900;
      font-size: 16px;
      width: 24px;
    }

    .rank-1 { color: #ffd700; }

    .trophy-mini-list {
      display: flex;
      gap: 3px;
      margin-top: 4px;
    }

    .trophy-mini-img {
      width: 16px;
      height: 16px;
      object-fit: contain;
    }
  </style>
</head>
<body>

  <header>
    <div class="user-badge">
      <div class="avatar" id="uAvatar">H</div>
      <div class="user-info">
        <div class="username" id="uName">Hacker_01</div>
        <div class="rank" id="uRank">Медвежатник</div>
      </div>
    </div>
    <div class="balance-pill">
      <span>🪙</span>
      <span id="uBalance">1,250</span>
    </div>
  </header>

  <main class="tab-page active" id="page-safes">
    <div class="section-title">
      <span>Выбери Сейф</span>
      <small style="font-size: 12px; color: var(--accent-cyan)">9 Хранилищ</small>
    </div>
    <div class="safes-grid" id="safesContainer"></div>
  </main>

  <main class="tab-page" id="page-inventory">
    <div class="section-title">
      <span>Коллекция Трофеев</span>
      <span style="font-size: 14px; color: var(--accent-gold)" id="collCount">0 / 9</span>
    </div>

    <div class="collection-counter">
      <div>
        <div style="font-size: 12px; color: var(--text-sub)">Пассивный майнинг</div>
        <div style="font-weight: 800; color: #00ff66; font-size: 16px" id="passiveIncome">+0 🪙/час</div>
      </div>
      <button class="btn-hack" style="width: auto; padding: 8px 16px;" onclick="claimMining()">Собрать</button>
    </div>

    <div class="items-grid" id="inventoryGrid"></div>
  </main>

  <main class="tab-page" id="page-market">
    <div class="section-title">
      <span>P2P Маркет</span>
      <small style="font-size: 11px; color: var(--text-sub)">Торговля с игроками</small>
    </div>
    <div id="marketList"></div>
  </main>

  <main class="tab-page" id="page-leaders">
    <div class="section-title">
      <span>Топ Взломщиков</span>
      <small style="font-size: 11px; color: var(--accent-pink)">Сезон 1</small>
    </div>
    <div id="leaderList"></div>
  </main>

  <div class="game-overlay" id="gameModal">
    <div class="game-header">
      <div>
        <h3 id="gSafeName" style="font-size: 18px; font-weight: 800">Сейф</h3>
        <p id="gSafeMode" style="font-size: 12px; color: var(--text-sub)">Режим: Логика</p>
      </div>
      <div class="game-timer-box" id="gTimer">00:30</div>
    </div>

    <div>
      <div class="digits-container" id="digitsRow"></div>
      <p id="gameHint" style="text-align: center; font-size: 13px; color: var(--accent-cyan); min-height: 20px;"></p>
    </div>

    <div class="numpad">
      <div class="num-btn" onclick="pressKey(1)">1</div>
      <div class="num-btn" onclick="pressKey(2)">2</div>
      <div class="num-btn" onclick="pressKey(3)">3</div>
      <div class="num-btn" onclick="pressKey(4)">4</div>
      <div class="num-btn" onclick="pressKey(5)">5</div>
      <div class="num-btn" onclick="pressKey(6)">6</div>
      <div class="num-btn" onclick="pressKey(7)">7</div>
      <div class="num-btn" onclick="pressKey(8)">8</div>
      <div class="num-btn" onclick="pressKey(9)">9</div>
      <div class="num-btn" style="color: var(--accent-pink)" onclick="clearKey()">C</div>
      <div class="num-btn" onclick="pressKey(0)">0</div>
      <div class="num-btn" style="color: #00ff66" onclick="submitCode()">OK</div>
    </div>

    <button class="btn-hack" style="background: rgba(255,255,255,0.1); margin-top: 10px;" onclick="closeGame()">Сдаться / Выход</button>
  </div>

  <nav class="bottom-nav">
    <div class="nav-item active" onclick="switchTab('safes', this)">
      <span class="icon">🔒</span>
      <span>Сейфы</span>
    </div>
    <div class="nav-item" onclick="switchTab('inventory', this)">
      <span class="icon">🎒</span>
      <span>Инвентарь</span>
    </div>
    <div class="nav-item" onclick="switchTab('market', this)">
      <span class="icon">🏪</span>
      <span>Маркет</span>
    </div>
    <div class="nav-item" onclick="switchTab('leaders', this)">
      <span class="icon">🏆</span>
      <span>Топ</span>
    </div>
  </nav>
    <script>
    // ИНИЦИАЛИЗА TELEGRAM WEB APP
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) {
      tg.expand();
      if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
        document.getElementById('uName').innerText = tg.initDataUnsafe.user.username || tg.initDataUnsafe.user.first_name;
        document.getElementById('uAvatar').innerText = (tg.initDataUnsafe.user.first_name || 'H')[0].toUpperCase();
      }
    }

    // 9 СЕЙФОВ (СТОИМОСТЬ, ВЫИГРЫШ И РЕЖИМЫ)
    const SAFES = [
      { id: 1, name: "🪵 Сундук", img: "IMG_20260719_180634.png", mode: "logic", cost: 50, len: 3, attempts: 5, reward: 150, dropId: 1, dropRate: 0.30 },
      { id: 2, name: "🟤 Чугунный", img: "IMG_20260719_181100.png", mode: "logic", cost: 100, len: 3, attempts: 5, reward: 300, dropId: 2, dropRate: 0.25 },
      { id: 3, name: "🥉 Медный", img: "IMG_20260719_181706.png", mode: "time", cost: 150, len: 4, time: 30, reward: 500, dropId: 3, dropRate: 0.20 },
      { id: 4, name: "⚙️ Штурвал", img: "IMG_20260719_183142.png", mode: "logic", cost: 250, len: 4, attempts: 5, reward: 800, dropId: 4, dropRate: 0.15 },
      { id: 5, name: "🗝️ Темный Сейф", img: "IMG_20260719_183244.png", mode: "time", cost: 400, len: 4, time: 25, reward: 1200, dropId: 5, dropRate: 0.12 },
      { id: 6, name: "🥈 Серебряный", img: "IMG_20260719_183338.png", mode: "logic", cost: 600, len: 5, attempts: 6, reward: 2000, dropId: 6, dropRate: 0.10 },
      { id: 7, name: "🥇 Золотой Банк", img: "IMG_20260719_183351.png", mode: "time", cost: 1000, len: 5, time: 20, reward: 3500, dropId: 7, dropRate: 0.08 },
      { id: 8, name: "🔘 Сканер Пальца", img: "IMG_20260719_183406.png", mode: "time", cost: 1500, len: 5, time: 18, reward: 5000, dropId: 8, dropRate: 0.05 },
      { id: 9, name: "💎 Кибер-Куб", img: "IMG_20260719_183425.png", mode: "time", cost: 2500, len: 5, time: 15, reward: 10000, dropId: 9, dropRate: 0.03 }
    ];

    // 9 ПРЕДМЕТОВ КОЛЛЕКЦИИ
    const ITEMS = [
      { id: 1, name: "Стетоскоп", img: "IMG_20260720_115622.png", income: 2 },
      { id: 2, name: "Отмычка", img: "IMG_20260720_115636.png", income: 5 },
      { id: 3, name: "Лазерный резак", img: "IMG_20260720_115645.png", income: 10 },
      { id: 4, name: "Майнер-Слиток", img: "IMG_20260720_115658.png", income: 25 },
      { id: 5, name: "Чип 'Призрак'", img: "IMG_20260720_115724.png", income: 50 },
      { id: 6, name: "Кибер-Перчатка", img: "IMG_20260720_115747.png", income: 80 },
      { id: 7, name: "Дешифратор", img: "IMG_20260720_115800.png", income: 120 },
      { id: 8, name: "Квантовый Тюнер", img: "IMG_20260720_115813.png", income: 200 },
      { id: 9, name: "Мастер-Карта", img: "IMG_20260720_115823.png", income: 500 }
    ];

    // СОСТОЯНИЕ ИГРОКА
    let state = JSON.parse(localStorage.getItem('starvault_state')) || {
      coins: 1250,
      inventory: [1],
      lastMiningTime: Date.now()
    };

    function saveState() {
      localStorage.setItem('starvault_state', JSON.stringify(state));
      document.getElementById('uBalance').innerText = state.coins.toLocaleString();
    }

    // ОТОБРАЖЕНИЕ СЕЙФОВ (С ЦЕНОЙ ОТКРЫТИЯ)
    function renderSafes() {
      const container = document.getElementById('safesContainer');
      container.innerHTML = SAFES.map(s => `
        <div class="safe-card">
          <span class="safe-mode-badge ${s.mode}">${s.mode === 'logic' ? '🧠 Логика' : '⚡ Время'}</span>
          <img src="${s.img}" class="safe-img" alt="${s.name}">
          <div class="safe-name">${s.name}</div>
          <div class="safe-cost">Цена: ${s.cost} 🪙</div>
          <div class="safe-reward">Приз: +${s.reward.toLocaleString()} 🪙</div>
          <button class="btn-hack" onclick="startSafeGame(${s.id})">ОТКРЫТЬ</button>
        </div>
      `).join('');
    }

    // ИНВЕНТАРЬ С КНОПКОЙ ВЫСТАВЛЕНИЯ НА МАРКЕТ
    function renderInventory() {
      const grid = document.getElementById('inventoryGrid');
      document.getElementById('collCount').innerText = `${state.inventory.length} / 9`;
      
      let totalIncome = 0;
      grid.innerHTML = ITEMS.map(item => {
        const owned = state.inventory.includes(item.id);
        if (owned) totalIncome += item.income;

        return `
          <div class="item-card ${owned ? '' : 'locked'}">
            <img src="${item.img}" class="item-img">
            <div class="item-title">${item.name}</div>
            <div style="font-size:9px; color:#00ff66; margin-top:2px;">+${item.income}🪙/ч</div>
            ${owned ? `<button class="btn-hack" style="margin-top:6px; padding:3px 0; font-size:10px; background:var(--accent-pink)" onclick="tradeItem(${item.id})">Продать</button>` : ''}
          </div>
        `;
      }).join('');

      document.getElementById('passiveIncome').innerText = `+${totalIncome} 🪙/час`;
    }
         // ТЕКУЩАЯ ИГРОВАЯ СЕССИЯ
    let activeSafe = null;
    let targetCode = "";
    let currentInput = "";
    let gameTimer = null;
    let secondsLeft = 0;
    let attemptsLeft = 0;

    // СМЕНА ВКЛАДОК
    function switchTab(tabId, el) {
      document.querySelectorAll('.tab-page').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      document.getElementById(`page-${tabId}`).classList.add('active');
      el.classList.add('active');

      if (tabId === 'inventory') renderInventory();
      if (tabId === 'market') renderMarket();
      if (tabId === 'leaders') renderLeaders();
    }

    // ЗАПУСК ВЗЛОМА (С ПРОВЕРКОЙ БАЛАНСА И СИСЧИСЛЕНИЕМ МОНЕТ)
    function startSafeGame(safeId) {
      activeSafe = SAFES.find(s => s.id === safeId);

      // Проверка монеток
      if (state.coins < activeSafe.cost) {
        alert(`❌ Недостаточно монет! Нужен входной взнос: ${activeSafe.cost} 🪙`);
        return;
      }

      // Списываем стоимость входа
      state.coins -= activeSafe.cost;
      saveState();

      // Генерируем секретный код
      targetCode = "";
      for (let i = 0; i < activeSafe.len; i++) {
        targetCode += Math.floor(Math.random() * 10).toString();
      }
      currentInput = "";

      document.getElementById('gSafeName').innerText = activeSafe.name;
      document.getElementById('gameHint').innerText = "";
      document.getElementById('gameModal').classList.add('active');

      if (activeSafe.mode === 'logic') {
        attemptsLeft = activeSafe.attempts;
        document.getElementById('gSafeMode').innerText = `Попыток: ${attemptsLeft}`;
        document.getElementById('gTimer').innerText = `🧠 x${attemptsLeft}`;
      } else {
        secondsLeft = activeSafe.time;
        document.getElementById('gSafeMode').innerText = `Таймер: ${activeSafe.time} сек`;
        document.getElementById('gTimer').innerText = `00:${secondsLeft < 10 ? '0' : ''}${secondsLeft}`;

        gameTimer = setInterval(() => {
          secondsLeft--;
          document.getElementById('gTimer').innerText = `00:${secondsLeft < 10 ? '0' : ''}${secondsLeft}`;
          if (secondsLeft <= 0) {
            clearInterval(gameTimer);
            alert("⏰ Время вышло! Сейф заблокирован.");
            closeGame();
          }
        }, 1000);
      }

      updateDigitsDisplay();
    }

    function pressKey(num) {
      if (currentInput.length < activeSafe.len) {
        currentInput += num.toString();
        updateDigitsDisplay();
      }
    }

    function clearKey() {
      currentInput = "";
      updateDigitsDisplay();
    }

    function updateDigitsDisplay() {
      const container = document.getElementById('digitsRow');
      container.innerHTML = "";
      for (let i = 0; i < activeSafe.len; i++) {
        const char = currentInput[i] || "_";
        container.innerHTML += `<div class="digit-box">${char}</div>`;
      }
    }

    // ВВОД КОДА И ПРОВЕРКА
    function submitCode() {
      if (currentInput.length < activeSafe.len) return;

      if (currentInput === targetCode) {
        if (gameTimer) clearInterval(gameTimer);
        state.coins += activeSafe.reward;

        let droppedMsg = "";
        if (Math.random() <= activeSafe.dropRate) {
          if (!state.inventory.includes(activeSafe.dropId)) {
            state.inventory.push(activeSafe.dropId);
            const droppedItem = ITEMS.find(i => i.id === activeSafe.dropId);
            droppedMsg = `\n\n🎁 НОВЫЙ ТРОФЕЙ ВЫБИТ: ${droppedItem.name}!`;
          }
        }

        saveState();
        if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
        alert(`🎉 СЕЙФ ВЗЛОМАН!\nНаграда: +${activeSafe.reward} 🪙${droppedMsg}`);
        closeGame();
      } else {
        let correctDigits = 0;
        for (let i = 0; i < activeSafe.len; i++) {
          if (currentInput[i] === targetCode[i]) correctDigits++;
        }

        if (activeSafe.mode === 'logic') {
          attemptsLeft--;
          document.getElementById('gSafeMode').innerText = `Попыток осталось: ${attemptsLeft}`;
          document.getElementById('gTimer').innerText = `🧠 x${attemptsLeft}`;

          if (attemptsLeft <= 0) {
            alert("❌ Попытки закончились! Сейф заблокирован.");
            closeGame();
            return;
          }
        }

        document.getElementById('gameHint').innerText = `❌ Неверно! Совпадений позиций: ${correctDigits}`;
        if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
      }
    }

    function closeGame() {
      if (gameTimer) clearInterval(gameTimer);
      document.getElementById('gameModal').classList.remove('active');
    }

    // ТОРГОВЛЯ И МАРКЕТ
    function tradeItem(itemId) {
      const item = ITEMS.find(i => i.id === itemId);
      const priceStr = prompt(`Выставить "${item.name}" на Маркет.\nУкажите цену в монетах:`, "1000");
      if (!priceStr) return;

      const price = parseInt(priceStr);
      if (isNaN(price) || price <= 0) {
        alert("❌ Указана неверная цена!");
        return;
      }

      state.inventory = state.inventory.filter(id => id !== itemId);
      
      let marketItems = JSON.parse(localStorage.getItem('starvault_market')) || [];
      marketItems.push({
        id: Date.now(),
        itemId: item.id,
        seller: document.getElementById('uName').innerText,
        price: price
      });
      localStorage.setItem('starvault_market', JSON.stringify(marketItems));

      saveState();
      renderInventory();
      alert(`✅ Предмет "${item.name}" выставлен за ${price} 🪙!`);
    }

    function renderMarket() {
      const list = document.getElementById('marketList');
      let marketItems = JSON.parse(localStorage.getItem('starvault_market')) || [];

      if (marketItems.length === 0) {
        list.innerHTML = `<p style="text-align:center; color:var(--text-sub); margin-top:20px;">На рынке пока нет лотов. Будь первым!</p>`;
        return;
      }

      list.innerHTML = marketItems.map(lot => {
        const item = ITEMS.find(i => i.id === lot.itemId);
        const isMyLot = lot.seller === document.getElementById('uName').innerText;

        return `
          <div class="leader-row">
            <div class="leader-left">
              <img src="${item.img}" style="width:40px; height:40px; object-fit:contain;">
              <div>
                <div style="font-weight:800; font-size:14px;">${item.name}</div>
                <div style="font-size:11px; color:var(--text-sub)">Продавец: @${lot.seller}</div>
              </div>
            </div>
            ${isMyLot 
              ? `<span style="font-size:12px; color:var(--accent-gold); font-weight:700;">Ваш лот (${lot.price} 🪙)</span>`
              : `<button class="btn-hack" style="width:auto; padding:6px 12px;" onclick="buyMarketItem(${lot.id})">${lot.price.toLocaleString()} 🪙</button>`
            }
          </div>
        `;
      }).join('');
    }

    function buyMarketItem(lotId) {
      let marketItems = JSON.parse(localStorage.getItem('starvault_market')) || [];
      const lotIndex = marketItems.findIndex(l => l.id === lotId);
      if (lotIndex === -1) return;

      const lot = marketItems[lotIndex];
      if (state.coins < lot.price) {
        alert("❌ Недостаточно монет!");
        return;
      }

      state.coins -= lot.price;
      if (!state.inventory.includes(lot.itemId)) {
        state.inventory.push(lot.itemId);
      }

      marketItems.splice(lotIndex, 1);
      localStorage.setItem('starvault_market', JSON.stringify(marketItems));

      saveState();
      renderMarket();
      alert("🎉 Покупка прошла успешно!");
    }

    // ЛИДЕРБОРД
    function renderLeaders() {
      const list = document.getElementById('leaderList');
      const myName = document.getElementById('uName').innerText;

      let leaders = [{ name: myName, coins: state.coins, items: state.inventory, isMe: true }];

      list.innerHTML = leaders.map((player, idx) => `
        <div class="leader-row" style="${player.isMe ? 'border-color: var(--accent-cyan);' : ''}">
          <div class="leader-left">
            <span class="rank-num rank-${idx + 1}">#${idx + 1}</span>
            <div>
              <div style="font-weight:800; font-size:14px;">@${player.name} ${player.isMe ? '(Вы)' : ''}</div>
              <div class="trophy-mini-list">
                ${player.items.map(itemId => {
                  const it = ITEMS.find(i => i.id === itemId);
                  return `<img src="${it.img}" class="trophy-mini-img">`;
                }).join('')}
              </div>
            </div>
          </div>
          <div style="font-weight:900; color:var(--accent-gold)">${player.coins.toLocaleString()} 🪙</div>
        </div>
      `).join('');
    }

    function claimMining() {
      const now = Date.now();
      const hoursPassed = (now - state.lastMiningTime) / (1000 * 60 * 60);
      
      let totalIncomeRate = 0;
      state.inventory.forEach(id => {
        const item = ITEMS.find(i => i.id === id);
        if (item) totalIncomeRate += item.income;
      });

      const earned = Math.floor(hoursPassed * totalIncomeRate);
      if (earned > 0) {
        state.coins += earned;
        state.lastMiningTime = now;
        saveState();
        alert(`💰 Собрано ${earned} монет!`);
      } else {
        alert("⏱️ Монеты пока не накопились, зайдите позже!");
      }
    }

    // СТАРТ ИНИЦИАЛИЗАЦИИ
    saveState();
    renderSafes();
  </script>
</body>
</html>
